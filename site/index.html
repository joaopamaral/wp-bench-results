    bindTestBodies($('testList'), (i) => [listed[i], r.test], s, { across: false });
  }

  /** Categories (from the build_data page): pass rate per category per model, one sequential ramp. */
  function viewCategories(r, s) {
    const rows = boardRuns(s);
    if (!rows.length) { main.innerHTML = `<div class="sheet empty">No models in ${esc(s.name)} match the filters.</div>`; return; }
    const stat = (x, c) => catStats(x, s).get(c);
    const avg = (c) => rows.reduce((acc, x) => acc + (rate(stat(x, c)) ?? 0), 0) / rows.length;
    const cats = s.cats.map(c => c.name).sort((a, b) => avg(b) - avg(a) || a.localeCompare(b));
    const cell = (x, c) => {
      const b = c ? stat(x, c) : { pass: x.passed, total: x.total, error: x.errored };
      const v = rate(b), cls = seqClass(v);
      if (!b || !b.total) return '<td><span class="cell seq na">—</span></td>';
      return `<td><span class="cell seq ${cls}" style="background:var(--${cls.split(' ')[0]})" role="button" tabindex="0" data-model="${esc(x.model)}" data-cat="${esc(c ?? '')}" data-p="${b.pass}" data-n="${b.total - b.error}">${Math.round(v * 100)}</span></td>`;
    };
    main.innerHTML = `
      ${syntheticNotice(s)}
      <div class="toolbar"><span>Pass rate per category for each model's latest run in ${esc(s.name)}; darker is higher. Click a cell to list its tests. Categories with fewer than 5 tests are marked <span class="chip">n&lt;5</span>: one test moves them by 20 points or more.</span><span class="grow"></span>${filterToggles()}</div>
      <div class="cat-layout">
      <div class="sheet pad grid-wrap">
        <table class="heat"><thead><tr><th class="cat"></th>${rows.map(x => `<th class="col${x.synthetic ? ' synthetic' : ''}" title="${esc(x.model)}${x.synthetic ? ' · synthetic' : ''}"><a href="${H.model(s.name, x.model)}">${esc(x.model)}</a></th>`).join('')}</tr></thead>
        <tbody>
          <tr class="total"><th class="cat">overall<span class="n">n=${s.full}</span></th>${rows.map(x => cell(x, null)).join('')}</tr>
          ${cats.map(c => { const n = s.cats.find(x => x.name === c).count; return `<tr><th class="cat"><a href="${H.cat(s.name, c)}">${esc(c)}</a><span class="n">n=${n}</span>${n < 5 ? ' <span class="chip">n&lt;5</span>' : ''}</th>${rows.map(x => cell(x, c)).join('')}</tr>`; }).join('')}
        </tbody></table>
        <div class="legend">0%<span class="ramp">${[100, 200, 300, 400, 500, 600, 700].map(n => `<i style="background:var(--seq-${n})"></i>`).join('')}</span>100%</div>
      </div>
      <div class="sheet" id="cellDetail" hidden></div>
      </div>`;
    bindFilterToggles();
    const heat = main.querySelector('table.heat');
    const open = (el) => {
      heat.querySelectorAll('.cell[aria-pressed]').forEach(x => x.removeAttribute('aria-pressed'));
      el.setAttribute('aria-pressed', 'true');
      showCell(s, rows.find(x => x.model === el.dataset.model), el.dataset.cat || null);
    };
    heat.addEventListener('click', e => { const el = e.target.closest('.cell[data-model]'); if (el) open(el); });
    heat.addEventListener('keydown', e => { const el = e.target.closest('.cell[data-model]'); if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open(el); } });
    heat.addEventListener('mousemove', e => { const el = e.target.closest('.cell[data-model]'); if (!el) return hideTip(); showTip(`<b>${esc(el.dataset.model)}</b><br>${esc(el.dataset.cat || 'overall')}: ${el.dataset.p}/${el.dataset.n} passed`, e.clientX, e.target.getBoundingClientRect().top); });
    heat.addEventListener('mouseleave', hideTip);
  }
  function showCell(s, run, cat) {
    if (!run) return;
    const ids = s.order.filter(([id, c]) => (!cat || c === cat) && statusOf(run, id) !== 'none').map(([id]) => id);
    const ok = ids.filter(id => statusOf(run, id) === 'pass').length;
    const el = $('cellDetail');
    el.hidden = false;
    el.innerHTML = `<div class="section-head cell-head"><h2>${modelName(run.model, H.model(s.name, run.model))} · ${cat ? `<a href="${H.cat(s.name, cat)}" class="mono">${esc(cat)}</a>` : 'all categories'}</h2><p>${ok}/${ids.length} passed</p></div>
      <div id="cellTests">${ids.map((id, i) => testRow(run, id, s, { i, showCat: !cat })).join('')}</div>`;
    bindTestBodies($('cellTests'), (i) => [run, ids[i]], s);
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /** Score vs cost (from the build_data page): overall against the run's estimated cost, log scale. */
  function viewCost(r, s) {
    const rows = boardRuns(s);
    main.innerHTML = `
      ${syntheticNotice(s)}
      <div class="toolbar"><span>Overall score against the estimated cost of the full run (log scale). Up and to the left is better. Hover a point for details, click it to open the model.</span><span class="grow"></span>${filterToggles()}</div>
      <div class="sheet pad"><svg id="scatter" class="chart" role="img" aria-label="Overall score versus estimated cost per run"></svg>
        ${rows.some(x => x.synthetic) ? `<div class="legend"><span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="var(--blueberry)"/></svg> real run</span><span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="var(--sheet)" stroke="var(--notice)" stroke-width="1.5" stroke-dasharray="2 1.5"/></svg> synthetic</span></div>` : ''}
      </div>
      <div class="sheet grid-wrap" style="margin-top:12px"><table class="grid">
        <thead><tr><th class="left">model</th><th class="right">overall</th><th class="right">cost / run</th><th class="right">$ / pass</th><th class="right">passes per $</th><th class="right">tokens / test</th><th class="right">latency p50</th></tr></thead>
        <tbody>${rows.map(x => `<tr><td class="left">${modelName(x.model, H.model(s.name, x.model))} ${chips(x, s)}</td><td class="right"><strong>${pct(x.scores.overall)}</strong></td><td class="right">${usd(x.cost.total)}</td><td class="right">${usd(x.cost.per_pass)}</td><td class="right">${x.cost.total ? (x.passed / x.cost.total).toFixed(1) : '—'}</td><td class="right">${int(x.tokens.completion_p50)}</td><td class="right">${secs(x.latency.p50)}</td></tr>`).join('')}</tbody>
      </table></div>`;
    bindFilterToggles();
    drawScatter(s, rows);
  }
  function drawScatter(s, rows) {
    const svg = $('scatter'); if (!svg) return;
    const pts = rows.filter(x => x.cost.total != null && x.scores.overall != null);
    const W = svg.clientWidth || 800, Hh = svg.clientHeight || 380, m = { t: 16, r: 28, b: 44, l: 52 };
    svg.setAttribute('viewBox', `0 0 ${W} ${Hh}`);
    if (!pts.length) { svg.innerHTML = `<text x="${W / 2}" y="${Hh / 2}" text-anchor="middle">No runs with cost estimates in this suite.</text>`; return; }
    const costs = pts.map(p => p.cost.total);
    const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...costs)))), hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...costs))));
    const x = (c) => m.l + (Math.log10(c) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo) || 1) * (W - m.l - m.r);
    const y = (v) => m.t + (1 - v) * (Hh - m.t - m.b);
    const xt = []; for (let v = lo; v <= hi * 1.0001; v *= 10) xt.push(v);
    const yt = [0, .2, .4, .6, .8, 1];
    svg.innerHTML = `
      ${yt.map(v => `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`).join('')}
      <line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"/><line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${y(0)}"/>
      ${yt.map(v => `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`).join('')}
      ${xt.map(v => `<text x="${x(v)}" y="${Hh - m.b + 18}" text-anchor="middle">$${v >= 1 ? v : v.toFixed(-Math.floor(Math.log10(v)))}</text>`).join('')}
      <text x="${(m.l + W - m.r) / 2}" y="${Hh - 6}" text-anchor="middle">estimated cost of the full run (log)</text>
      ${pts.map((p, i) => `<circle class="dot${p.synthetic ? ' synthetic' : ''}" r="6" cx="${x(p.cost.total)}" cy="${y(p.scores.overall)}" data-i="${i}" tabindex="0" role="link" aria-label="${esc(p.model)}: ${pct(p.scores.overall)}, ${usd(p.cost.total)}"/>`).join('')}
      ${pts.map(p => `<text class="lbl${p.synthetic ? ' synthetic' : ''}" x="${x(p.cost.total) + 10}" y="${y(p.scores.overall) + 4}">${esc(shortName(p.model))}</text>`).join('')}`;
    svg.querySelectorAll('.dot').forEach(d => {
      const p = pts[+d.dataset.i];
      d.addEventListener('mousemove', e => showTip(`<b>${esc(p.model)}</b>${p.synthetic ? ' · synthetic' : ''}<br>overall ${pct(p.scores.overall)} · ${usd(p.cost.total)} per run<br>${usd(p.cost.per_pass)} per passed test · p50 ${secs(p.latency.p50)}`, e.clientX, d.getBoundingClientRect().top));
      d.addEventListener('mouseleave', hideTip);
      const go = () => { location.hash = H.model(s.name, p.model); };
      d.addEventListener('click', go);
      d.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    });
  }
  addEventListener('resize', () => { const r = S.loaded && route(); if (r && r.view === 'cost') drawScatter(S.suites.get(r.suite), boardRuns(S.suites.get(r.suite))); });

  function viewCategory(r, s) {
    const c = s.cats.find(x => x.name === r.cat);
    if (!c) { main.innerHTML = `${crumbs(s, [[esc(r.cat)]])}<div class="status">No category called <code>${esc(r.cat)}</code> in ${esc(s.name)}.</div>`; return; }
    const rows = boardRuns(s);
    const ids = s.order.slice(c.start, c.start + c.count).map(([id]) => id);
    const mark = (st) => st === 'pass' ? '<span class="ok" aria-label="passed">✓</span>' : st === 'fail' ? '<span class="ko" aria-label="failed">✗</span>' : st === 'error' ? '<span class="er" aria-label="errored">!</span>' : '<span class="na" aria-label="not run">·</span>';
    main.innerHTML = `
      ${crumbs(s, [['categories', H.cats(s.name)], [esc(c.name)]])}
      <div class="hero"><div><h1>${esc(c.name)}</h1><div class="chips"><span class="chip">${c.count} tests</span><a class="chip" href="${esc(definitionUrl(s.name, c.name))}" rel="noopener" target="_blank">Test definitions ↗</a></div></div></div>
      <div class="sheet grid-wrap"><table class="grid">
        <thead><tr><th class="rowh">test</th><th>passed by</th>${rows.map(x => `<th title="${esc(x.model)}"><a href="${H.model(s.name, x.model)}">${esc(shortName(x.model))}</a>${x.synthetic ? '<br><span class="chip synthetic">synthetic</span>' : ''}</th>`).join('')}</tr></thead>
        <tbody>${ids.map(id => {
          const sts = rows.map(x => statusOf(x, id));
          const ran = sts.filter(v => v !== 'none').length, ok = sts.filter(v => v === 'pass').length;
          return `<tr><th class="rowh"><a href="${H.test(s.name, id)}">${esc(id)}</a></th>${seqCell(ran ? ok / ran : null, `${ok}/${ran}`)}${sts.map(st => `<td class="mark"><a href="${H.test(s.name, id)}" title="${STATUS[st]}">${mark(st)}</a></td>`).join('')}</tr>`;
        }).join('')}</tbody>
      </table></div>`;
  }

  function viewCompare(r, s) {
    const runs = S.compare.map(m => primaryRun(s, m)).filter(Boolean);
    if (runs.length < 2) {
      main.innerHTML = `<div class="section-head" style="margin-top:0"><h2>Compare models</h2></div><div class="sheet empty">Tick two or three models in the <a href="${H.board(s.name)}">ranking</a> to line their tests up here.${runs.length ? ` Picked so far: ${runs.map(x => `<code>${esc(x.model)}</code>`).join(', ')}.` : ''}</div>`;
      return;
    }
    const [a] = runs;
    const only = runs.map(() => []), allFailed = [], mixed = [];
    for (const [id] of s.order) {
      const st = runs.map(x => statusOf(x, id));
      if (st.every(v => v === 'none')) continue;
      const pass = st.map(v => v === 'pass');
      const n = pass.filter(Boolean).length;
      if (n === runs.length) continue;
      if (n === 0) { if (st.some(v => v === 'fail' || v === 'error')) allFailed.push(id); continue; }
      if (n === 1) only[pass.indexOf(true)].push(id); else mixed.push(id);
    }
    const catRows = s.cats.map(c => ({ c, rates: runs.map(x => rate(catStats(x, s).get(c.name))) }))
      .map(row => ({ ...row, spread: Math.max(...row.rates.map(v => v ?? 0)) - Math.min(...row.rates.map(v => v ?? 0)) }))
      .sort((x, y) => y.spread - x.spread || x.c.name.localeCompare(y.c.name));
    const ids = (list) => list.length ? `<div class="idlist">${list.map(id => `<a href="${H.test(s.name, id)}">${esc(id)}</a>`).join('')}</div>` : '<p class="muted" style="margin:6px 0 0">None.</p>';
    const delta = (x) => { const d = (x.scores.overall - a.scores.overall) * 100; return `<span class="${d >= 0 ? 'delta-up' : 'delta-down'}" style="font-size:13px;font-weight:500">${d >= 0 ? '+' : ''}${d.toFixed(1)}</span>`; };
    main.innerHTML = `
      ${crumbs(s, [['compare']])}
      <div class="cmp-heads">${runs.map((x, i) => `<div class="sheet">${modelName(x.model, H.model(s.name, x.model))}<div>${chips(x, s)}</div><div class="score" style="text-align:left">${(x.scores.overall * 100).toFixed(1)}<small>%</small> ${i ? delta(x) : ''}</div><div class="muted num" style="font-size:12.5px">${x.passed}/${x.total} passed · ${usd(x.cost.total)}${i && a.cost.total && x.cost.total ? ` (${(x.cost.total / a.cost.total).toFixed(1)}×)` : ''} · ${secs(x.latency.p50)}</div></div>`).join('')}</div>
      <div class="sheet cmp-lanes" id="board">
        <div class="ruler-wrap"><div class="ruler-label" id="rulerLabel" style="margin-left:0"><span>Strips line up test by test · hover to find a category or test</span></div><div class="lane">${ruler(s)}</div></div>
        <ol class="ledger">${runs.map(x => `<li class="entry"><div class="line" style="grid-template-columns:minmax(0,1fr) auto"><span class="who">${modelName(x.model)}</span><span class="facts num">${x.passed}/${x.total}</span></div><div class="lane${x.synthetic ? ' synthetic' : ''}">${strip(x, s)}</div></li>`).join('')}</ol>
      </div>
      <div class="section-head"><h2>Where they differ</h2><p>${only.reduce((n, l) => n + l.length, 0) + mixed.length} tests split the models · ${allFailed.length} fail everywhere</p></div>
      <div class="diff-groups">
        ${runs.map((x, i) => `<div class="sheet"><h3>Only ${modelName(x.model)} passed <span class="c num">${only[i].length}</span></h3>${ids(only[i])}</div>`).join('')}
        ${runs.length > 2 ? `<div class="sheet"><h3>Split <span class="c num">${mixed.length}</span></h3>${ids(mixed)}</div>` : ''}
        <div class="sheet"><h3>Every model failed <span class="c num">${allFailed.length}</span></h3>${ids(allFailed)}</div>
      </div>
      <div class="section-head"><h2>Categories</h2><p>largest gaps first</p></div>
      <div class="sheet grid-wrap"><table class="grid">
        <thead><tr><th class="rowh">category</th>${runs.map(x => `<th>${esc(shortName(x.model))}</th>`).join('')}<th>gap</th></tr></thead>
        <tbody>${catRows.map(({ c, rates, spread }) => `<tr><th class="rowh"><a href="${H.cat(s.name, c.name)}">${esc(c.name)}</a></th>${rates.map(v => seqCell(v, pct(v, 0))).join('')}<td class="num muted">${spread ? (spread * 100).toFixed(0) + ' pts' : '—'}</td></tr>`).join('')}</tbody>
      </table></div>`;
  }

  /** History (from the build_data page): every commit that touched the results folder, with score snapshots. */
  function viewHistory() {
    const Hs = S.data.history || [];
    main.innerHTML = `
      <div class="section-head" style="margin-top:0"><h2>History</h2><p>every commit that touched <code>${RESULTS}</code> · pick one to see which runs it added, removed or changed and how the latest score per model moved</p></div>
      ${Hs.length ? `<div class="hist"><div class="sheet commits" id="commits">${Hs.map((c, i) => `
        <div class="commit" data-i="${i}" tabindex="0">
          <div class="msg" title="${esc(c.message)}">${esc(c.message.split('\n')[0])}</div>
          <div class="meta"><span>${esc(c.author)}</span><span>${day(c.date)}</span><a href="${esc(commitUrl(c.sha))}" rel="noopener" target="_blank" onclick="event.stopPropagation()"><code>${esc(c.short)}</code></a><span>${c.added.length ? `+${c.added.length} ` : ''}${c.removed.length ? `−${c.removed.length} ` : ''}${c.modified.length ? `~${c.modified.length}` : ''}</span></div>
        </div>`).join('')}</div><div class="sheet diff" id="diff"></div></div>` : '<div class="sheet empty">No commits recorded in the data file.</div>'}`;
    if (!Hs.length) return;
    $('commits').querySelectorAll('.commit').forEach(el => {
      const open = () => showCommit(+el.dataset.i);
      el.addEventListener('click', open);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });
    showCommit(0);
  }
  function showCommit(i) {
    const Hs = S.data.history, c = Hs[i], prev = Hs[i + 1];
    $('commits').querySelectorAll('.commit').forEach(d => d.classList.toggle('active', +d.dataset.i === i));
    const synth = new Set(S.runs.filter(r => r.synthetic).map(r => `${r.file}#${r.model}`));
    const latest = (snap) => { const m = new Map(); for (const x of snap) { const k = `${x.suite} · ${x.model}`; const ts = (x.file.match(/results_(\d{8}_\d{6})/) || [])[1] || ''; if (!m.has(k) || ts > m.get(k).ts) m.set(k, { ...x, ts }); } return m; };
    const A = latest(c.snapshot), B = latest(prev ? prev.snapshot : []);
    const added = [...A.keys()].filter(k => !B.has(k)), removed = [...B.keys()].filter(k => !A.has(k));
    const changed = [...A.keys()].filter(k => B.has(k) && (A.get(k).overall !== B.get(k).overall || A.get(k).file !== B.get(k).file));
    const tag = (x) => synth.has(`${x.file}#${x.model}`) ? ' <span class="chip synthetic">synthetic</span>' : '';
    const row = (x) => `<li>${modelName(x.model)}${tag(x)} <span class="muted">${esc(x.suite)} · ${esc(x.file)}</span> — <strong>${pct(x.overall)}</strong> <span class="muted">(${x.passed}/${x.total})</span></li>`;
    $('diff').innerHTML = `
      <p style="margin:0 0 4px;white-space:pre-wrap"><strong>${esc(c.message.split('\n')[0])}</strong>${c.message.includes('\n') ? '\n' + esc(c.message.split('\n').slice(1).join('\n').trim()) : ''}</p>
      <p class="muted" style="margin:0 0 12px;font-size:12px">${esc(c.author)} · ${day(c.date)}, ${esc(c.date.slice(11, 16))} · <a href="${esc(commitUrl(c.sha))}" rel="noopener" target="_blank"><code>${esc(c.short)}</code></a> · files: ${[...c.added.map(f => '+' + f), ...c.removed.map(f => '−' + f), ...c.modified.map(f => '~' + f)].map(esc).join(', ') || 'none'}</p>
      <p class="faint" style="margin:0;font-size:12.5px">${A.size} model runs after this commit, ${B.size} before.</p>
      <h3>Models added <span class="faint num">${added.length}</span></h3>${added.length ? `<ul>${added.map(k => row(A.get(k))).join('')}</ul>` : '<p class="muted">None</p>'}
      <h3>Models removed <span class="faint num">${removed.length}</span></h3>${removed.length ? `<ul>${removed.map(k => row(B.get(k))).join('')}</ul>` : '<p class="muted">None</p>'}
      <h3>Latest run changed <span class="faint num">${changed.length}</span></h3>${changed.length ? `<ul>${changed.map(k => { const x = A.get(k), y = B.get(k); const d = (x.overall - y.overall) * 100; return `<li>${modelName(x.model)} <span class="muted">${esc(x.suite)}</span>: ${pct(y.overall)} → <span class="${d >= 0 ? 'delta-up' : 'delta-down'}">${pct(x.overall)} (${d >= 0 ? '+' : ''}${d.toFixed(1)})</span> <span class="muted">${esc(y.file)} → ${esc(x.file)}</span></li>`; }).join('')}</ul>` : '<p class="muted">None</p>'}`;
  }

  /** How it works (from the build_data page): the publishing flow and what gets ranked. */
  function viewHow() {
    const mono = 'class="m"';
    main.innerHTML = `
      <div class="section-head" style="margin-top:0"><h2>How it works</h2><p>raw run outputs are the source of truth; one small prebuilt data file is all this page needs</p></div>
      <figure class="sheet pad" style="margin:0">
        <svg class="diagram" viewBox="0 0 960 420" role="img" aria-label="A contributor runs wp-bench and opens a pull request with the raw output to the wp-bench-results repository; build_data.py turns the results folder and its git history into one data file; Spacefast serves the static site, and the browser fetches only that data file.">
          <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
          <g fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="20" y="130" width="190" height="120" rx="8"/>
            <rect x="300" y="40" width="380" height="340" rx="8"/>
            <rect x="325" y="110" width="150" height="70" rx="6"/>

  function crumbs(s, parts) {
    return `<nav class="crumbs" aria-label="Breadcrumb"><a href="${H.board(s.name)}">${esc(s.name)}</a>${parts.map(([label, href], i) => `<span aria-hidden="true">›</span>${href ? `<a href="${href}">${label}</a>` : `<span class="here"${i === parts.length - 1 ? ' aria-current="page"' : ''}>${label}</span>`}`).join('')}</nav>`;
  }

  // ---------- compare tray ----------
  function renderTray(r) {
    const tray = $('tray');
    const show = S.compare.length && r.view !== 'compare' && !GLOBAL_VIEWS.includes(r.view);
    tray.hidden = !show;
    if (!show) return;
    tray.innerHTML = `<span class="names">${S.compare.map(m => `<span>${esc(m)}<button type="button" data-unpick="${esc(m)}" aria-label="Remove ${esc(m)}">×</button></span>`).join('')}</span>
      ${S.compare.length > 1 ? `<a class="btn primary" href="${H.compare(r.suite, S.compare)}">Compare ${S.compare.length}</a>` : '<span class="hint">pick one more</span>'}
      <button type="button" class="btn" data-unpick="*">Clear</button>`;
  }
  document.addEventListener('change', e => {
    const box = e.target.closest('[data-pick]'); if (!box) return;
    const m = box.dataset.pick;
    S.compare = box.checked ? [...new Set([...S.compare, m])].slice(-3) : S.compare.filter(x => x !== m);
    main.querySelectorAll('[data-pick]').forEach(b => { b.checked = S.compare.includes(b.dataset.pick); b.closest('.entry, tr')?.classList.toggle('picked', b.checked); });
    renderChrome(route()); renderTray(route());
  });
  $('tray').addEventListener('click', e => {
    const b = e.target.closest('[data-unpick]'); if (!b) return;
    S.compare = b.dataset.unpick === '*' ? [] : S.compare.filter(x => x !== b.dataset.unpick);
    render();
  });

  // ---------- strip hover / click ----------
  const tip = $('tip');
  function showTip(html, x, y) {
    tip.innerHTML = html; tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x - w / 2)) + 'px';
    tip.style.top = (y - h - 12 < 8 ? y + 18 : y - h - 12) + 'px';
  }
  function hideTip() { tip.hidden = true; document.querySelectorAll('#board, .big-lane').forEach(el => setBand(el, null, null)); const l = $('rulerLabel'); if (l && l.dataset.idle) l.innerHTML = l.dataset.idle; }
  main.addEventListener('mousemove', e => {
    const svg = e.target.closest('svg.strip, svg.ruler'); if (!svg) return;
    const s = S.suites.get(svg.dataset.suite); if (!s) return;
    const container = svg.closest('#board, .big-lane');
    const label = $('rulerLabel');
    if (label && !label.dataset.idle) label.dataset.idle = label.innerHTML;
    if (svg.classList.contains('ruler')) {
      const c = catAt(s, svg, e.clientX);
      setBand(container, s, c);
      tip.hidden = true;
      if (label) label.innerHTML = c ? `<strong>${esc(c.name)}</strong><span>${c.count} tests · click to open the category</span>` : label.dataset.idle;
      return;
    }
    const [id, cat] = s.order[testIndexAt(s, svg, e.clientX)];
    const run = S.runs.find(x => x.key === svg.dataset.run);
    const st = run ? statusOf(run, id) : 'none';
    const c = s.cats.find(x => x.name === cat);
    setBand(container, s, c);
    if (label) label.innerHTML = `<strong>${esc(cat)}</strong><span>${c.count} tests</span>`;
    const why = run?.failures[id]?.assertions?.[0];
    showTip(`<b>${esc(id)}</b> · <span class="s-${st}">${STATUS[st]}</span><br>${esc(run?.model || '')}${why ? `<br>${esc(plain(why))}` : ''}`, e.clientX, svg.getBoundingClientRect().top);
  });
  main.addEventListener('mouseleave', hideTip);
  main.addEventListener('mouseout', e => { if (e.target.closest?.('svg.strip, svg.ruler') && !e.relatedTarget?.closest?.('svg.strip, svg.ruler')) hideTip(); });
  main.addEventListener('click', e => {
    const svg = e.target.closest('svg.strip, svg.ruler'); if (!svg) return;
    const s = S.suites.get(svg.dataset.suite); if (!s) return;
    if (svg.classList.contains('ruler')) { const c = catAt(s, svg, e.clientX); if (c) location.hash = H.cat(s.name, c.name); return; }
    location.hash = H.test(s.name, s.order[testIndexAt(s, svg, e.clientX)][0]);
  });

  // ---------- jump-to search ----------
  const q = $('q'), list = $('qResults');
  let options = [], active = -1;
  function searchIndex(term) {
    const t = term.trim().toLowerCase();
    if (!t) return [];
    const rank = (text) => { const v = text.toLowerCase(); const i = v.indexOf(t); return i < 0 ? -1 : i === 0 ? 0 : 1; };
    const take = (items, n) => items.map(x => ({ ...x, rank: rank(x.key) })).filter(x => x.rank >= 0).sort((a, b) => a.rank - b.rank || a.key.localeCompare(b.key, undefined, { numeric: true })).slice(0, n);
    const models = [], cats = [], tests = [];
    for (const s of S.suites.values()) {
      for (const m of new Set(s.runs.map(x => x.model))) { const run = primaryRun(s, m); models.push({ group: 'Models', key: m, desc: `${s.name} · ${pct(run.scores.overall)}${run.synthetic ? ' · synthetic' : ''}`, href: H.model(s.name, m) }); }
      for (const c of s.cats) cats.push({ group: 'Categories', key: c.name, desc: `${s.name} · ${c.count} tests`, href: H.cat(s.name, c.name) });
      for (const [id, cat] of s.order) tests.push({ group: 'Tests', key: id, desc: `${s.name} · ${cat}`, href: H.test(s.name, id) });
    }
    return [...take(models, 6), ...take(cats, 5), ...take(tests, 8)];
  }
  function showResults() {
    options = searchIndex(q.value);
    active = options.length ? 0 : -1;
    if (!q.value.trim()) { closeResults(); return; }
    let group = '';
    list.innerHTML = options.length ? options.map((o, i) => `${o.group !== group ? `<li class="group" role="presentation">${(group = o.group)}</li>` : ''}<li role="option" id="opt${i}" data-i="${i}" aria-selected="${i === active}"><span class="k">${esc(o.key)}</span><span class="d">${esc(o.desc)}</span></li>`).join('') : `<li class="none" role="presentation">Nothing matches "${esc(q.value.trim())}".</li>`;
    list.hidden = false;
    q.setAttribute('aria-expanded', 'true');
    q.setAttribute('aria-activedescendant', active >= 0 ? 'opt' + active : '');
  }
  function closeResults() { list.hidden = true; q.setAttribute('aria-expanded', 'false'); q.removeAttribute('aria-activedescendant'); }
  function move(d) {
    if (!options.length) return;
    active = (active + d + options.length) % options.length;
    list.querySelectorAll('[role="option"]').forEach(el => el.setAttribute('aria-selected', String(+el.dataset.i === active)));
    q.setAttribute('aria-activedescendant', 'opt' + active);
    $('opt' + active)?.scrollIntoView({ block: 'nearest' });
  }
  function choose(i) { const o = options[i]; if (!o) return; location.hash = o.href; q.value = ''; closeResults(); q.blur(); }
  q.addEventListener('input', showResults);
  q.addEventListener('focus', () => { if (q.value.trim()) showResults(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (list.hidden) showResults(); else move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(active); }
    else if (e.key === 'Escape') { if (!list.hidden) closeResults(); else { q.value = ''; q.blur(); } }
  });
  list.addEventListener('mousedown', e => { const li = e.target.closest('[role="option"]'); if (li) { e.preventDefault(); choose(+li.dataset.i); } });
  document.addEventListener('click', e => { if (!e.target.closest('#search')) closeResults(); });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.target.closest('input, textarea, select, [contenteditable]')) { e.preventDefault(); q.focus(); q.select(); }
  });

  // ---------- local files: upload, drop and follow ----------
  const fileInput = Object.assign(document.createElement('input'), { type: 'file', accept: '.json,.jsonl,.partial,application/json', multiple: true, hidden: true });
  document.body.append(fileInput);
  const canFollow = () => typeof window.showOpenFilePicker === 'function';
  // Files being followed while a run is still writing them (File System Access API, Chromium).
  const LIVE = { handles: new Map(), timer: null, busy: false, message: '' };

  /** Replace everything a file contributed with its latest runs, then rebuild the suites around them. */
  function setLocalRuns(name, runs) {
    // The final results_<timestamp>.json / .jsonl supersedes the .jsonl.partial the harness wrote for the same run.
    const partial = /\.partial$/i.test(name) ? null : name.replace(/\.jsonl?$/i, '.jsonl.partial');
    S.runs = S.runs.filter(x => x.localFile !== name && x.localFile !== partial).concat(runs);
    for (const x of S.runs) delete x._cats;
    buildSuites();
  }

  async function addLocalFiles(files) {
    LIVE.message = '';
    const added = [], failed = [];
    for (const f of files) {
      try {
        const runs = await parseUpload(f);
        if (runs.length) { setLocalRuns(f.name, runs); added.push(...runs); } else failed.push(`${f.name}: ${t('no wp-bench run output found.')}`);
      } catch (e) { failed.push(`${f.name}: ${e.message}`); }
    }
    if (failed.length) LIVE.message = failed.join(' · ');
    if (added.length) location.hash = H.model(added[0].suite, added[0].model, added[0].file);
    render();
  }

  async function followHandle(handle) {
    LIVE.handles.set(handle.name, { handle, stamp: '', runs: null, updated: null });
    if (!LIVE.timer) LIVE.timer = setInterval(() => pollFollowed(false), 1500);
    await pollFollowed(true);
  }
  function stopFollowing() {
    LIVE.handles.clear();
    clearInterval(LIVE.timer); LIVE.timer = null;
  }
  async function pollFollowed(initial) {
    if (LIVE.busy || (document.hidden && !initial)) return;
    LIVE.busy = true;
    let changed = false, first = null;
    try {
      for (const [name, h] of [...LIVE.handles]) {
        let file;
        try { file = await h.handle.getFile(); }
        catch { LIVE.handles.delete(name); LIVE.message = t('{name} is gone: the run has probably finished. Upload the final results_<timestamp>.json to keep it.', { name }); changed = true; continue; }
        const stamp = `${file.lastModified}:${file.size}`;
        if (stamp === h.stamp) continue;
        h.stamp = stamp;
        try {
          const runs = await parseUpload(file);
          if (runs.length) { setLocalRuns(name, runs); h.runs = runs; h.updated = new Date(); first ||= runs; changed = true; }
        } catch (e) { LIVE.message = `${name}: ${e.message}`; changed = true; }
      }
    } finally { LIVE.busy = false; }
    if (!LIVE.handles.size && LIVE.timer) stopFollowing();
    if (!changed) return;
    if (initial && first) location.hash = H.model(first[0].suite, first[0].model, first[0].file);
    render();
  }
  async function pickToFollow() {
    try {
      const [handle] = await window.showOpenFilePicker({ multiple: false, types: [{ description: 'wp-bench output', accept: { 'application/json': ['.json', '.jsonl', '.partial'] } }] });
      await followHandle(handle);
    } catch (e) { if (e.name !== 'AbortError') { LIVE.message = e.message; render(); } }
  }
  function clearLocal() {
    stopFollowing();
    LIVE.message = '';
    S.runs = S.runs.filter(x => !x.local);
    for (const x of S.runs) delete x._cats;
    buildSuites();
    location.hash = '#/';
    render();
  }

  /** The strip under the masthead: what is being previewed, the live status and the way out. */
  function renderLocalBar() {
    const bar = $('localbar'), local = S.runs.filter(x => x.local), following = [...LIVE.handles.values()];
    if (!local.length && !following.length && !LIVE.message) { bar.hidden = true; bar.innerHTML = ''; return; }
    bar.hidden = false;
    const files = [...new Set(local.map(x => x.localFile))];
    let text = '';
    if (following.length) {
      const h = following[0], run = h.runs?.[0];
      text = `<span class="livedot" aria-hidden="true"></span><span>${t('Following')} <b>${esc(h.handle.name)}</b>${run ? ` · <b>${run.total}</b> ${t('tests graded')} · ${t('score')} <b>${pct(run.scores.overall)}</b>` : ''}${h.updated ? ` · ${t('updated')} ${h.updated.toLocaleTimeString()}` : ''}</span>`;
    } else if (local.length) {
      text = `<span>${t('Previewing local results')}: ${files.map(f => `<code>${esc(f)}</code>`).join(', ')} · ${t('only in this tab, nothing is uploaded')}</span>`;
    }
    bar.innerHTML = `<div class="localbar">${text}${LIVE.message ? `<span class="msg">${esc(LIVE.message)}</span>` : ''}<span class="grow"></span>
      ${canFollow() && !following.length ? `<button type="button" class="btn" data-action="follow">${t('Follow a running benchmark')}</button>` : ''}
      ${following.length ? `<button type="button" class="btn" data-action="stop">${t('Stop following')}</button>` : ''}
      ${local.length || LIVE.message ? `<button type="button" class="btn" data-action="clear">${t('Clear')}</button>` : ''}</div>`;
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-action]'); if (!b) return;
    const act = b.dataset.action;
    if (act === 'upload') fileInput.click();
    else if (act === 'follow') pickToFollow();
    else if (act === 'stop') { stopFollowing(); render(); }
    else if (act === 'clear') clearLocal();
  });
  fileInput.addEventListener('change', e => { addLocalFiles([...e.target.files]); e.target.value = ''; });

  const dropHint = $('dropHint');
  document.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); dropHint.hidden = false; } });
  document.addEventListener('dragleave', e => { if (!e.relatedTarget) dropHint.hidden = true; });
  document.addEventListener('drop', async e => {
    if (!e.dataTransfer.files.length) return;
    e.preventDefault();
    dropHint.hidden = true;
    // Handles must be requested while the event is still alive; a dropped .partial file can then be followed.
    const files = [...e.dataTransfer.files];
    const handles = await Promise.all([...e.dataTransfer.items].map(i => i.kind === 'file' && i.getAsFileSystemHandle ? i.getAsFileSystemHandle().catch(() => null) : null));
    const plain = [];
    for (const [i, f] of files.entries()) {
      if (/\.partial$/i.test(f.name) && handles[i]?.kind === 'file') await followHandle(handles[i]); else plain.push(f);
    }
    if (plain.length) await addLocalFiles(plain);
  });

  function exportCsv(s, rows) {
    const cols = [['rank', x => x.rank], ['model', x => x.model], ['suite', x => x.suite], ['overall', x => x.scores.overall], ['ci95', x => wilson(x.scores.overall, x.total)],
      ['execution_pass_rate', x => x.scores.execution_pass_rate], ['runtime', x => x.scores.runtime], ['static_policy_pass_rate', x => x.scores.static_policy_pass_rate],
      ['scoring_version', x => x.scoring_version], ['passed', x => x.passed], ['total', x => x.total], ['suite_size', () => s.full], ['errored', x => x.errored],
      ['cost_usd', x => x.cost.total], ['cost_per_pass_usd', x => x.cost.per_pass], ['latency_p50_ms', x => x.latency.p50], ['latency_p90_ms', x => x.latency.p90],
      ['run_date', x => x.run_date], ['file', x => x.file], ['synthetic', x => x.synthetic], ['published_by', x => x.published?.by]];
    const cell = (v) => v == null ? '' : /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
    const csv = [cols.map(c => c[0]).join(','), ...rows.map(x => cols.map(([, f]) => cell(f(x))).join(','))].join('\n') + '\n';
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv' })), download: `wp-bench-${s.name}.csv` });
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ---------- boot ----------
  window.addEventListener('hashchange', () => { render(); window.scrollTo({ top: 0 }); });
  fetch(DATA_URL, { cache: 'no-cache' })
    .then(res => { if (!res.ok) throw new Error(`${res.status} ${res.statusText}`); return res.json(); })
    .then(d => {
      S.data = d;
      RESULTS = d.results_dir || 'results';
      S.runs = (d.runs || []).map(r => adapt(r));
      buildSuites();
      S.loaded = true;
      $('srcLine').textContent = `${S.runs.length} runs · ${Object.keys(d.tests || {}).length} tests · data built ${String(d.generated_at || '').replace('T', ' ').slice(0, 16)} UTC${qs.get('data') ? ` · ${DATA_URL}` : d.source_commit ? ` from ${REPO}@${d.source_commit.slice(0, 7)}` : ''}`;
      render();
    })
    .catch(e => { main.innerHTML = `<div class="status err">Couldn't load the leaderboard data.<br><span class="muted">${esc(DATA_URL)} · ${esc(e.message)}</span></div>`; });
})();
</script>
</body>
</html>
