<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WP-Bench Leaderboard</title>
<meta name="description" content="How well AI models write WordPress code: wp-bench scores per suite, model, category and test, cost against score, model comparisons and the full history of published runs.">
<style>
  /* Colors come from wp-admin: its canvas gray, the Gutenberg ink, the admin
     theme blue, and the core notice green / red / yellow, each with one meaning.
     Pass rates use one sequential blue ramp; red only ever marks a failed test. */
  :root {
    --admin-canvas: #f0f0f1;
    --sheet: #ffffff;
    --sheet-sunk: #f6f7f7;
    --ink: #1e1e1e;
    --ink-2: #3c434a;
    --ink-3: #646970;
    --ink-4: #8c8f94;
    --rule: rgba(30, 30, 30, .10);
    --rule-strong: rgba(30, 30, 30, .20);
    --blueberry: #3858e9;
    --blueberry-ink: #2145e6;
    --blueberry-wash: rgba(56, 88, 233, .09);
    --pass: #00a32a;
    --pass-ink: #007017;
    --fail: #d63638;
    --fail-ink: #b32d2e;
    --notice: #dba617;
    --notice-ink: #614a00;
    --notice-wash: rgba(219, 166, 23, .16);
    --tick-pass: rgba(30, 30, 30, .24);
    --hatch: repeating-linear-gradient(135deg, var(--notice-wash) 0 3px, transparent 3px 7px);
    --seq-100: #cde2fb; --seq-200: #9ec5f4; --seq-300: #6da7ec; --seq-400: #3987e5; --seq-500: #256abf; --seq-600: #184f95; --seq-700: #0d366b;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --admin-canvas: #141414; --sheet: #1e1e1e; --sheet-sunk: #171717;
      --ink: #f0f0f1; --ink-2: #c3c4c7; --ink-3: #a7aaad; --ink-4: #8c8f94;
      --rule: rgba(255, 255, 255, .09); --rule-strong: rgba(255, 255, 255, .17);
      --blueberry: #7b90ff; --blueberry-ink: #9aa9ff; --blueberry-wash: rgba(123, 144, 255, .13);
      --pass: #4ab866; --pass-ink: #68de7c; --fail: #f86368; --fail-ink: #ff8085;
      --notice: #f0c33c; --notice-ink: #f0c33c; --notice-wash: rgba(240, 195, 60, .14);
      --tick-pass: rgba(255, 255, 255, .26);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --admin-canvas: #141414; --sheet: #1e1e1e; --sheet-sunk: #171717;
    --ink: #f0f0f1; --ink-2: #c3c4c7; --ink-3: #a7aaad; --ink-4: #8c8f94;
    --rule: rgba(255, 255, 255, .09); --rule-strong: rgba(255, 255, 255, .17);
    --blueberry: #7b90ff; --blueberry-ink: #9aa9ff; --blueberry-wash: rgba(123, 144, 255, .13);
    --pass: #4ab866; --pass-ink: #68de7c; --fail: #f86368; --fail-ink: #ff8085;
    --notice: #f0c33c; --notice-ink: #f0c33c; --notice-wash: rgba(240, 195, 60, .14);
    --tick-pass: rgba(255, 255, 255, .26);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { margin: 0; background: var(--admin-canvas); color: var(--ink); font: 14px/1.5 var(--sans); }
  a { color: var(--blueberry-ink); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--blueberry); outline-offset: 2px; border-radius: 4px; }
  code, .mono { font-family: var(--mono); font-size: 13px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
  h2 { font-size: 16px; font-weight: 600; }
  h3 { font-size: 14px; font-weight: 600; }
  p { text-wrap: pretty; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-3); }
  .faint { color: var(--ink-4); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  [hidden] { display: none !important; }

  /* masthead */
  .masthead { position: sticky; top: 0; z-index: 20; background: var(--admin-canvas); border-bottom: 1px solid var(--rule); }
  .masthead .row { display: flex; align-items: center; gap: 16px; padding-top: 12px; }
  .brand { display: flex; align-items: baseline; gap: 6px; color: var(--ink); font-weight: 600; font-size: 16px; white-space: nowrap; }
  .brand:hover { text-decoration: none; }
  .brand span { color: var(--ink-3); font-weight: 400; }
  .suites { display: flex; border: 1px solid var(--rule-strong); border-radius: 4px; overflow: hidden; background: var(--sheet); flex-shrink: 0; }
  .suites a { padding: 6px 12px; color: var(--ink-3); font-size: 13px; white-space: nowrap; }
  .suites a + a { border-left: 1px solid var(--rule); }
  .suites a:hover { background: var(--sheet-sunk); text-decoration: none; color: var(--ink); }
  .suites a[aria-current="true"] { color: var(--ink); font-weight: 600; background: var(--sheet-sunk); }
  .suites a small { color: var(--ink-4); font-weight: 400; margin-left: 4px; font-size: 12px; }
  .search { position: relative; flex: 1; min-width: 0; max-width: 420px; margin-left: auto; }
  .search input { width: 100%; font: inherit; font-size: 13px; padding: 8px 36px 8px 32px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--sheet-sunk); color: var(--ink); }
  .search input::placeholder { color: var(--ink-4); }
  .search input:focus { outline: none; border-color: var(--blueberry); box-shadow: 0 0 0 1px var(--blueberry); background: var(--sheet); }
  .search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--ink-4); pointer-events: none; }
  .search kbd { position: absolute; right: 8px; top: 50%; translate: 0 -50%; font: 11px var(--mono); color: var(--ink-3); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 5px; background: var(--sheet); }
  .search input:focus ~ kbd { display: none; }
  .results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: min(70vh, 460px); overflow: auto; padding: 4px; margin: 0; list-style: none; }
  .results .group { padding: 8px 12px 4px; font-size: 11px; font-weight: 600; color: var(--ink-4); letter-spacing: .04em; text-transform: uppercase; }
  .results [role="option"] { display: flex; gap: 12px; align-items: baseline; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
  .results [role="option"] .k { font-family: var(--mono); font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .results [role="option"] .d { margin-left: auto; font-size: 12px; color: var(--ink-4); white-space: nowrap; }
  .results [aria-selected="true"] { background: var(--blueberry-wash); }
  .results .none { padding: 12px; color: var(--ink-3); font-size: 13px; }
  .views { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
  .views a { padding: 8px 12px; color: var(--ink-3); font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap; }
  .views a:hover { color: var(--ink); text-decoration: none; }
  .views a[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .views .pill { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--blueberry); color: var(--sheet); font-size: 11px; font-weight: 600; text-align: center; }

  /* page scaffolding */
  /* .wrap sets horizontal padding; main.wrap outranks it so the vertical rhythm survives. */
  main.wrap { padding-top: 24px; padding-bottom: 112px; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-4); margin-bottom: 12px; }
  .crumbs a { color: var(--ink-3); }
  .crumbs .here { color: var(--ink); font-family: var(--mono); font-size: 13px; }
  .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; }
  .pad { padding: 16px; }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin: 28px 0 10px; }
  .section-head p { margin: 0; color: var(--ink-3); font-size: 13px; }
  .lede { margin: 0 0 12px; color: var(--ink-3); font-size: 13px; }
  .status { padding: 48px 16px; text-align: center; color: var(--ink-3); }
  .status.err { color: var(--fail-ink); }
  .notice { padding: 12px 16px; font-size: 13px; color: var(--ink-2); background: var(--sheet); border: 1px solid var(--rule); border-left: 3px solid var(--notice); border-radius: 0 4px 4px 0; margin: 0 0 16px; }
  .notice.synthetic { background: var(--hatch), var(--sheet); }
  .notice.fail { border-left-color: var(--fail); }
  .notice.live { border-left-color: var(--pass); }

  /* local files: upload, drop and follow */
  #uploadBtn { flex-shrink: 0; }
  .seg.lang { flex-shrink: 0; }
  .seg.lang button { padding: 6px 8px; font-size: 12px; font-weight: 500; letter-spacing: .02em; }
  #localbar:not([hidden]) { padding-top: 16px; }
  .localbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: var(--blueberry-wash); border: 1px solid color-mix(in srgb, var(--blueberry) 30%, transparent); border-radius: 8px; font-size: 13px; color: var(--ink-2); }
  .localbar > span:not(.livedot):not(.grow) { min-width: 0; overflow-wrap: anywhere; }
  .localbar b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .localbar .grow { flex: 1; }
  .localbar .msg { color: var(--notice-ink); }
  .livedot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); animation: livepulse 1.6s ease-in-out infinite; flex-shrink: 0; }
  @keyframes livepulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .drophint { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 55%, transparent); color: var(--sheet); pointer-events: none; }
  .drophint[hidden] { display: none; }
  .drophint div { display: grid; gap: 4px; padding: 24px 32px; border: 2px dashed currentColor; border-radius: 8px; text-align: center; }
  .drophint strong { font-size: 20px; font-weight: 600; }
  .drophint span { font-size: 13px; opacity: .85; }

  /* controls */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 10px; font-size: 13px; color: var(--ink-3); }
  .toolbar .grow { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 4px; overflow: hidden; background: var(--sheet); }
  .seg button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--ink-3); padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button:hover { color: var(--ink); background: var(--sheet-sunk); }
  .seg button[aria-pressed="true"] { color: var(--ink); font-weight: 600; background: var(--sheet-sunk); }
  .seg button .c { color: var(--ink-4); font-weight: 400; margin-left: 4px; }
  .check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
  .check input { accent-color: var(--blueberry); margin: 0; }
  .btn { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--sheet); color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--sheet-sunk); color: var(--ink); text-decoration: none; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--blueberry); border-color: var(--blueberry); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--blueberry-ink); color: #fff; }
  input[type=search].field { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--sheet-sunk); color: var(--ink); min-width: 224px; }
  input[type=search].field:focus { outline: none; border-color: var(--blueberry); box-shadow: 0 0 0 1px var(--blueberry); }

  /* chips */
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; line-height: 18px; padding: 0 8px; border-radius: 999px; background: var(--sheet-sunk); color: var(--ink-3); border: 1px solid var(--rule); white-space: nowrap; vertical-align: middle; }
  .chip.full { color: var(--pass-ink); border-color: color-mix(in srgb, var(--pass) 35%, transparent); background: color-mix(in srgb, var(--pass) 8%, transparent); }
  .chip.synthetic { color: var(--notice-ink); border-color: color-mix(in srgb, var(--notice) 50%, transparent); background: var(--hatch), var(--sheet); font-weight: 600; }
  .chip.subset, .chip.errored { color: var(--notice-ink); border-color: color-mix(in srgb, var(--notice) 50%, transparent); background: var(--notice-wash); }
  .chip.live { color: var(--pass-ink); border-color: color-mix(in srgb, var(--pass) 45%, transparent); background: color-mix(in srgb, var(--pass) 10%, transparent); }
  .chip.local { color: var(--blueberry-ink); border-color: color-mix(in srgb, var(--blueberry) 40%, transparent); background: var(--blueberry-wash); }

  /* ledger (ranking) */
  .ledger { list-style: none; margin: 0; padding: 0; position: relative; }
  .entry { padding: 12px 16px; border-top: 1px solid var(--rule); }
  .entry:first-child { border-top: 0; }
  .entry:hover { background: color-mix(in srgb, var(--sheet-sunk) 70%, transparent); }
  .entry.picked { background: var(--blueberry-wash); }
  .line { display: grid; grid-template-columns: 22px 28px minmax(0, 1fr) auto 112px; align-items: center; gap: 0 10px; }
  .rank { color: var(--ink-4); font-size: 13px; text-align: right; }
  .pick { display: grid; place-items: center; width: 40px; height: 40px; cursor: pointer; border-radius: 4px; }
  .pick:hover { background: var(--sheet-sunk); }
  .pick input { accent-color: var(--blueberry); margin: 0; cursor: pointer; }
  .who { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; }
  .model { font-family: var(--mono); font-size: 13px; color: var(--ink); font-weight: 500; overflow-wrap: anywhere; }
  .model .prov { color: var(--ink-4); font-weight: 400; }
  a.model:hover { text-decoration: none; color: var(--blueberry-ink); }
  .facts { display: flex; gap: 16px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .facts .by { color: var(--ink-4); }
  .score { text-align: right; font-size: 20px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .score small { font-size: 13px; font-weight: 400; color: var(--ink-4); margin-left: 1px; }
  .score .ci { font-size: 11px; font-weight: 400; color: var(--ink-4); margin-left: 4px; letter-spacing: 0; }
  .lane { position: relative; margin: 8px 0 0 70px; }
  .lane::after { content: ""; position: absolute; top: -3px; bottom: -3px; left: var(--band-l, 0); width: var(--band-w, 0); background: var(--blueberry-wash); border-left: 1px solid color-mix(in srgb, var(--blueberry) 45%, transparent); border-right: 1px solid color-mix(in srgb, var(--blueberry) 45%, transparent); pointer-events: none; display: var(--band-d, none); }
  .lane.synthetic { background: var(--hatch); border-radius: 4px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* home list (the build_data page's table, with a compare column and a failure strip) */
  .statline { display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr)); margin: 0 0 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .statline div { padding: 8px 16px; border-left: 1px solid var(--rule); min-width: 0; }
  .statline div:first-child { border-left: 0; }
  .statline dt { font-size: 11px; font-weight: 500; color: var(--ink-4); letter-spacing: .04em; text-transform: uppercase; }
  .statline dd { margin: 2px 0 0; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .statline b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .statline .who-s { font-family: var(--mono); font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .statline .who-s a { color: inherit; }
  table.board { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.board th, table.board td { padding: 8px 12px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; vertical-align: middle; }
  table.board tbody tr:last-child td { border-bottom: 0; }
  table.board th.left, table.board td.left { text-align: left; }
  table.board thead th { position: sticky; top: 0; z-index: 1; background: var(--sheet-sunk); color: var(--ink-3); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; }
  table.board thead th:hover { color: var(--ink); }
  table.board thead th.nosort { cursor: default; }
  table.board thead th.nosort:hover { color: var(--ink-3); }
  table.board thead th .dir { color: var(--ink-4); font-size: 11px; margin-left: 4px; }
  table.board tbody tr:hover td { background: var(--sheet-sunk); }
  table.board tr.picked td { background: var(--blueberry-wash); }
  table.board tr.dim td:not(.pickc) { opacity: .55; }
  table.board tr.group td { padding: 8px 16px; text-align: left; background: var(--sheet-sunk); border-top: 1px solid var(--rule-strong); color: var(--ink-3); font-size: 12px; white-space: normal; }
  table.board tr.group strong { color: var(--ink-2); font-weight: 600; }
  table.board tr.group:hover td { background: var(--sheet-sunk); }
  table.board td.rank { color: var(--ink-4); width: 24px; }
  table.board .pickc { width: 48px; padding: 0 0 0 8px; text-align: center; }
  table.board .pickc .pick { width: 40px; height: 40px; margin: 0; }
  /* Chips drop under the model name only when the column runs out of room (longer labels in PT and ES). */
  table.board .who { flex-wrap: wrap; }
  table.board .byline { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-4); }
  table.board .byline a { color: var(--ink-3); }
  table.board td.overall strong { font-size: 14px; font-weight: 600; }
  table.board .ci { color: var(--ink-4); font-size: 11px; margin-left: 4px; }
  table.board td.mini { width: 184px; }
  table.board td.mini.synthetic svg.minibars { background: var(--hatch); border-radius: 4px; }
  table.board td.drawer-cell { white-space: normal; width: 64px; }
  details.drawer summary { cursor: pointer; color: var(--blueberry-ink); font-size: 12px; list-style: none; }
  details.drawer summary::-webkit-details-marker { display: none; }
  .drawer-body { text-align: left; font-size: 13px; color: var(--ink-2); padding: 8px 0 4px; width: min(560px, 60vw); margin-left: auto; }
  .drawer-body dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
  .drawer-body dt { color: var(--ink-4); }
  .drawer-body dd { margin: 0; overflow-wrap: anywhere; }
  .unranked-head { padding: 8px 16px; border-top: 1px solid var(--rule-strong); background: var(--sheet-sunk); font-size: 12px; color: var(--ink-3); }
  .unranked-head strong { color: var(--ink-2); font-weight: 600; }
  .ledger.dim .entry:first-child { border-top: 0; }
  .ledger.dim .lane, .ledger.dim .score { opacity: .5; }
  svg.strip { display: block; width: 100%; cursor: crosshair; overflow: visible; }
  svg.strip .p { fill: var(--tick-pass); }
  svg.strip .f { fill: var(--fail); }
  svg.strip .e { fill: var(--notice); }
  svg.strip .n { fill: var(--rule-strong); }
  svg.minibars { display: block; width: 160px; height: 16px; overflow: visible; }
  svg.minibars .p { fill: var(--tick-pass); }
  svg.minibars .f { fill: var(--fail); }
  svg.minibars .n { fill: var(--rule-strong); }
  .ruler-wrap { padding: 12px 16px 8px; border-bottom: 1px solid var(--rule); background: var(--sheet-sunk); border-radius: 8px 8px 0 0; }
  .ruler-wrap .lane { margin-top: 0; }
  svg.ruler { display: block; width: 100%; cursor: pointer; }
  svg.ruler rect { fill: var(--rule-strong); }
  svg.ruler rect:nth-child(even) { fill: var(--ink-4); }
  .ruler-label { display: flex; gap: 8px; align-items: baseline; margin: 0 0 6px 70px; font-size: 12px; color: var(--ink-3); min-height: 18px; }
  .ruler-label strong { font-family: var(--mono); font-weight: 500; color: var(--ink); font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 12px; color: var(--ink-3); margin: 10px 2px 0; }
  .legend i { display: inline-block; width: 2px; vertical-align: -1px; margin-right: 6px; }
  .legend .ramp { display: inline-flex; gap: 2px; align-items: center; }
  .legend .ramp i { width: 20px; height: 12px; border-radius: 4px; margin: 0; }

  /* model page */
  .hero { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; margin-bottom: 16px; }
  .hero h1 { font-family: var(--mono); font-size: 28px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .hero .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .big-score { text-align: right; }
  .big-score .v { font-size: 44px; font-weight: 600; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .big-score .v small { font-size: 18px; font-weight: 500; color: var(--ink-4); }
  .big-score .l { font-size: 12px; color: var(--ink-3); margin-top: 4px; }

  .empty { padding: 28px 16px; text-align: center; color: var(--ink-3); font-size: 13px; }

  /* tables and heatmaps */
  .grid-wrap { overflow-x: auto; }

  .idlist a:hover { border-color: var(--blueberry); color: var(--blueberry-ink); text-decoration: none; }

  /* score vs cost */

  svg.diagram text { font-family: var(--sans); }

  .tray .names button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; opacity: .7; }
  .tray .names button:hover { opacity: 1; }
  .tray .btn { border-color: transparent; }
  .tray .hint { opacity: .75; }

  /* history */
  .hist { display: grid; grid-template-columns: 1fr; gap: 16px; }

  .commits { max-height: 70vh; overflow: auto; }

  .diff { padding: 16px; }

  /* tooltip */

  .tip b { font-family: var(--mono); font-weight: 500; }

  footer.foot { padding: 0 16px 32px; font-size: 12px; color: var(--ink-4); }
  footer.foot p { margin: 4px 0; }

  @media (max-width: 720px) {
    .masthead { position: static; }

    .masthead .row { flex-wrap: wrap; gap: 12px; }

    table.heat th.col { max-height: 110px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .btn:active { transform: none; } .livedot { animation: none; } }
</style>

<body>
<header class="masthead">
  <div class="wrap">

        <input id="q" type="text" role="combobox" aria-expanded="false" aria-controls="qResults" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Jump to a model, category or test" aria-label="Jump to a model, category or test" data-i18n-attr="placeholder:Jump to a model, category or test;aria-label:Jump to a model, category or test">
        <kbd aria-hidden="true">/</kbd>

  <p><span id="srcLine"></span> · <a id="dataLink" href="#">leaderboard.json</a> · <a id="buildLink" href="#" rel="noopener">build_data.py</a> · <a id="folderLink" href="#" rel="noopener">results/</a></p>
</footer>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const clean = (v) => (v || '').replace(/[^\w.\/-]/g, '');
  // The page and the data file built next to it live in the results repository; ?repo= and ?ref= only change links.
  const REPO = clean(qs.get('repo')) || 'joaopamaral/wp-bench-results';
  const REF = clean(qs.get('ref')) || 'main';
  // ?data= swaps in another data file while developing: a .json path next to this page or a raw.githubusercontent.com URL.
  const DATA_URL = ((d) => d && (/^https:\/\/raw\.githubusercontent\.com\/[\w.\/-]+\.json$/.test(d) || /^(?!.*\.\.)[\w.\/-]+\.json$/.test(d)) ? d
    : 'data/leaderboard.json')(qs.get('data'));
  // Test definitions live with the harness, not with the results.
  const BENCH = 'WordPress/wp-bench';
  let RESULTS = 'results';
  const RUN_FILE = /^results_(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})\.json$/;
  const $ = (id) => document.getElementById(id);
  const main = $('main');
  // ---------- language ----------
  const LANGS = { en: { name: 'English', tag: 'en-US' }, pt: { name: 'Português', tag: 'pt-BR' }, es: { name: 'Español', tag: 'es' } };
  const detectLang = () => {
    const asked = qs.get('lang');
    if (LANGS[asked]) return asked;
    try { const saved = localStorage.getItem('wpb-lang'); if (LANGS[saved]) return saved; } catch {}
    const browser = (navigator.languages?.[0] || navigator.language || 'en').slice(0, 2).toLowerCase();
    return LANGS[browser] ? browser : 'en';
  };
  let LANG = detectLang();
  const TAG = () => LANGS[LANG].tag;
  /** The English text is the key and {name} marks a value; a text missing from the dictionary shows in English. */
  const t = (text, vars) => {
    const out = I18N[LANG]?.[text] || text;
    return vars ? out.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '') : out;
  };
  $('buildLink').href = `https://github.com/${REPO}/blob/${REF}/site/build_data.py`;
  $('folderLink').href = `https://github.com/${REPO}/tree/${REF}/results`;
  $('folderLink').textContent = `${REPO}/results`;
  $('dataLink').href = DATA_URL;
  const commitUrl = (sha) => `https://github.com/${REPO}/commit/${sha}`;
  const fileUrl = (run) => `https://github.com/${REPO}/blob/${run.published?.sha || REF}/${RESULTS}/${run.file}`;
  const definitionUrl = (suite, category) => `https://github.com/${BENCH}/blob/trunk/datasets/suites/${suite}/execution/${category}.json`;

  // ---------- data ----------
  const S = {
    data: { tests: {}, runs: [], history: [] }, runs: [], suites: new Map(), compare: [], loaded: false,
    board: { sort: 'overall', dir: -1, all: false, q: '' }, tests: { status: 'fail', cat: '', q: '' },
    showSynthetic: pref('synthetic', true),
  };
  function pref(k, d) { try { const v = localStorage.getItem('wpb-pref:' + k); return v == null ? d : v === '1'; } catch { return d; } }
  function setPref(k, v) { try { localStorage.setItem('wpb-pref:' + k, v ? '1' : '0'); } catch {} }

  /** One run per model per file, from data/leaderboard.json (built by build_data.py). */
  function adapt(r, extra = {}) {
    return {
      key: r.id, file: r.file, model: r.model, suite: r.suite ?? '—', scoring_version: r.scoring_version ?? '—',
      result_schema_version: r.result_schema_version, run_date: r.run_date, run_ts: r.run_ts,
      synthetic: !!r.synthetic, limit: r.limit ?? null, config: r.config || {}, scores: r.scores || {},
      usage: r.usage || {}, cost: r.cost_usd || {}, latency: r.latency_ms || {}, tokens: r.tokens || {},
      passed: r.tests.passed, total: r.tests.total, errored: r.tests.errored,
      categories: r.categories || {}, passedSet: new Set(r.passed_ids || []), failures: r.failures || {},
      published: r.published, ...extra,
    };
  }
  const statusOf = (run, id) => run.passedSet.has(id) ? 'pass' : run.failures[id] ? (run.failures[id].reason === 'harness error' ? 'error' : 'fail') : 'none';
  const STATUS = { get pass() { return t('passed'); }, get fail() { return t('failed'); }, get error() { return t('errored'); }, get none() { return t('not run'); } };

  // Local previews: the same summary build_data.py writes, computed in the browser from a raw output.
  const pctl = (values, f) => { if (!values.length) return null; const o = [...values].sort((a, b) => a - b); return o[Math.min(o.length - 1, Math.max(0, Math.round(f * (o.length - 1))))]; };
  function failureDetail(rec) {
    const g = rec.grader || {}, raw = g.raw || {}, sc = rec.scores || {};
    const reason = rec.error ? 'harness error' : g.timeout ? 'timeout' : sc.static_policy_pass === false ? 'forbidden static pattern' : !g.success ? 'runtime crash' : 'assertion failed';
    const assertions = (raw.runtime?.details?.assertions || []).filter(a => a.passed === false).map(a => a.description || a.type || 'assertion');
    const stderr = (g.stderr || '').trim();
    return { reason, assertions: assertions.slice(0, 5), runtime_score: sc.runtime ?? null, stderr: stderr ? stderr.slice(-300) : null, error: rec.error ? JSON.stringify(rec.error).slice(0, 300) : null };
  }
  // Runs the visitor brings along: raw `wp-bench run` outputs read in the browser, never uploaded anywhere.
  const LOCAL_STAMP = /results_(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/;
  const usageOf = (records, k) => records.map(x => x.usage?.[k]).filter(v => typeof v === 'number');
  const sumOf = (list) => list.reduce((a, b) => a + b, 0);

  /** A run shaped like the rows build_data.py writes, computed from a model's per-test records. */
  function localRun(file, model, emd, records, extra = {}) {
    const m = LOCAL_STAMP.exec(file);
    const now = new Date().toISOString();
    const passed_ids = [], failures = {}, categories = {};
    for (const rec of records) {
      const c = categories[rec.category] ||= { passed: 0, total: 0 };
      c.total++;
      if (rec.scores?.execution_pass) { c.passed++; passed_ids.push(rec.test_id); } else failures[rec.test_id] = failureDetail(rec);
      S.data.tests[rec.test_id] ||= { suite: rec.suite, category: rec.category, source_refs: rec.metadata?.source_refs || [] };
    }
    const lat = usageOf(records, 'latency_ms'), cost = usageOf(records, 'cost_usd');
    const total = cost.length === records.length && records.length ? sumOf(cost) : null;
    return adapt({
      id: `local:${file}:${model}`, file, model, suite: emd.suite, scoring_version: emd.scoring_version, result_schema_version: emd.result_schema_version,
      run_date: m ? `${m[1]}-${m[2]}-${m[3]}` : now.slice(0, 10), run_ts: m ? m.slice(1).join('') : now.replace(/\D/g, '').slice(0, 14),
      synthetic: !!emd.synthetic, limit: emd.limit ?? null,
      config: { kind: emd.model?.kind, temperature: emd.model?.temperature, runtime_image_id: emd.runtime_image_id, runtime_isolation: emd.runtime_isolation, runtime_isolation_boundary: emd.runtime_isolation_boundary, execution_concurrency: emd.execution_concurrency, seed: emd.seed, grader: emd.grader?.kind, database: emd.grader?.database },
      scores: emd.scores, usage: emd.usage || {},
      tests: { passed: passed_ids.length, total: records.length, errored: records.filter(x => x.error).length },
      latency_ms: { p50: pctl(lat, .5), p90: pctl(lat, .9), max: lat.length ? Math.max(...lat) : null, total_min: lat.length ? Math.round(sumOf(lat) / 6000) / 10 : null },
      cost_usd: { total, per_pass: total != null && passed_ids.length ? total / passed_ids.length : null },
      tokens: { completion_p50: pctl(usageOf(records, 'completion_tokens'), .5) },
      categories, passed_ids, failures, published: null,
    }, { local: true, localFile: file, ...extra });
  }

  /** A results_<timestamp>.json payload: one model (metadata + results) or several (metadata + models). */
  function runsFromRaw(file, doc) {
    const md = doc.metadata || {};
    if (md.mode === 'exploit_audit') throw new Error(t('Exploit audits are not leaderboard runs.'));
    const entries = Array.isArray(doc.results)
      ? (md.mode && md.mode !== 'model' ? [] : [[md.model?.name, md, doc.results]])
      : Object.values(doc.models || {}).filter(e => (e.variant?.kind ?? 'none') === 'none').map(e => [e.config?.name, { ...md, model: e.config, scores: e.scores }, e.results || []]);
    return entries.filter(([name, emd]) => name && emd.scores).map(([model, emd, records]) => localRun(file, model, emd, records));
  }

  /** The published suite whose tests overlap these records the most; a new suite name when none does. */
  function inferSuite(records) {
    let best = null, bestN = 0;
    for (const s of S.suites.values()) {
      let n = 0;
      for (const rec of records) if (s.tests.has(rec.test_id)) n++;
      if (n > bestN) { best = s.name; bestN = n; }
    }
    return best || records[0]?.suite || t('uploaded');
  }

  /** Per-test records (results_<timestamp>.jsonl, or the .jsonl.partial a run is still writing): the scores are computed here, as the harness does. */
  function runsFromRecords(file, records, partial) {
    const groups = new Map();
    for (const rec of records) {
      if (!rec?.test_id || !rec.model?.name || (rec.variant?.kind ?? 'none') !== 'none' || (rec.mode && rec.mode !== 'model')) continue;
      if (!groups.has(rec.model.name)) groups.set(rec.model.name, []);
      groups.get(rec.model.name).push(rec);
    }
    return [...groups].map(([model, recs]) => {
      const suite = inferSuite(recs);
      const graded = recs.filter(r => !r.error);
      const mean = (f) => { const v = graded.map(f).filter(x => typeof x === 'number'); return v.length ? sumOf(v) / v.length : null; };
      const policy = graded.map(r => r.scores?.static_policy_pass).filter(v => v != null);
      const overall = graded.length ? graded.filter(r => r.scores?.execution_pass).length / graded.length : null;
      const scores = { correctness: mean(r => r.scores?.correctness), execution_pass_rate: overall, runtime: mean(r => r.scores?.runtime), static_policy_pass_rate: policy.length ? policy.filter(Boolean).length / policy.length : null, overall };
      const usage = { prompt_tokens: sumOf(usageOf(recs, 'prompt_tokens')), completion_tokens: sumOf(usageOf(recs, 'completion_tokens')) };
      return localRun(file, model, { suite, scoring_version: S.suites.get(suite)?.scoring ?? null, scores, usage, model: recs[0].model }, recs, { partial });
    });
  }

  /** Read one uploaded file: .json, .jsonl or .jsonl.partial. A last line still being written is skipped. */
  async function parseUpload(file) {
    const text = await file.text();
    if (/\.jsonl(\.partial)?$/i.test(file.name)) {
      const records = [];
      for (const line of text.split('\n')) {
        if (!line.trim()) continue;
        try { records.push(JSON.parse(line)); } catch { /* the harness is mid-write */ }
      }
      return runsFromRecords(file.name, records, /\.partial$/i.test(file.name));
    }
    return runsFromRaw(file.name, JSON.parse(text));
  }

  /** Group runs by suite; the suite's test order (category, then id) is the x axis of every strip. */
  function buildSuites() {
    const suites = new Map();
    for (const r of S.runs) {
      let s = suites.get(r.suite);
      if (!s) suites.set(r.suite, s = { name: r.suite, runs: [], tests: new Map() });
      s.runs.push(r);
      for (const id of [...r.passedSet, ...Object.keys(r.failures)]) if (!s.tests.has(id)) s.tests.set(id, S.data.tests[id]?.category ?? '—');
    }
    for (const s of suites.values()) {
      s.order = [...s.tests].sort((a, b) => a[1].localeCompare(b[1]) || a[0].localeCompare(b[0], undefined, { numeric: true }));
      s.size = s.order.length;
      s.index = new Map(s.order.map(([id], i) => [id, i]));
      s.cats = [];
      s.order.forEach(([, cat], i) => { const last = s.cats[s.cats.length - 1]; if (last && last.name === cat) last.count++; else s.cats.push({ name: cat, start: i, count: 1 }); });
      let x = 0;
      s.xs = new Float32Array(s.size);
      for (const c of s.cats) { c.x = x; for (let k = 0; k < c.count; k++) { s.xs[c.start + k] = x; x += TICK; } c.w = x - c.x - (TICK - TICK_W); x += GAP; }
      s.width = x - GAP;
      // Rank only within the newest scoring version present in the suite.
      s.scoring = [...new Set(s.runs.map(r => r.scoring_version))].sort((a, b) => parseFloat(b) - parseFloat(a) || String(b).localeCompare(String(a)))[0];
      // The full suite is the largest test count among the current scoring version's runs; anything
      // smaller is a partial run or an earlier revision of the suite, never ranked with full runs.
      s.full = Math.max(0, ...s.runs.filter(r => r.scoring_version === s.scoring).map(r => r.total));
      for (const r of s.runs) r.subset = r.total < s.full || !!r.limit || !!r.partial;
    }
    S.suites = suites;
  }

  const latestOf = (runs) => {
    const best = new Map();
    for (const r of runs) if (!best.has(r.model) || r.run_ts > best.get(r.model).run_ts) best.set(r.model, r);
    return [...best.values()];
  };
  /** The ranking for a suite: each model's latest full run at the suite's scoring version, never partial or other-version runs. */
  function boardRuns(s) {
    const pool = s.runs.filter(r => r.scoring_version === s.scoring && !r.subset && (S.showSynthetic || !r.synthetic));
    const rows = latestOf(pool).sort((a, b) => (b.scores.overall ?? -1) - (a.scores.overall ?? -1) || b.passed - a.passed || a.model.localeCompare(b.model));
    rows.forEach((r, i) => r.rank = i + 1);
    return rows;
  }
  /** Runs the ranking leaves out: a model's latest partial or other-version run, when it has no ranked run or is newer than it. */
  function unrankedRuns(s, ranked) {
    const rankedBy = new Map(ranked.map(r => [r.model, r]));
    return latestOf(s.runs.filter(r => !ranked.includes(r) && (S.showSynthetic || !r.synthetic)))
      .filter(r => !rankedBy.has(r.model) || r.run_ts > rankedBy.get(r.model).run_ts)
      .sort((a, b) => (b.scores.overall ?? -1) - (a.scores.overall ?? -1) || a.model.localeCompare(b.model));
  }
  const latestRun = (s, model) => latestOf(s.runs.filter(r => r.model === model))[0] || null;
  /** The run that stands for a model: its latest full run at the suite's scoring version, else its latest run. */
  const primaryRun = (s, model) => latestOf(s.runs.filter(r => r.model === model && !r.subset && r.scoring_version === s.scoring))[0] || latestRun(s, model);
  function catStats(run, s) {
    if (!run._cats) {
      run._cats = new Map(s.cats.map(c => [c.name, { name: c.name, total: 0, pass: 0, fail: 0, error: 0 }]));
      for (const [id, cat] of s.order) { const st = statusOf(run, id); if (st === 'none') continue; const b = run._cats.get(cat); if (!b) continue; b.total++; b[st]++; }
    }
    return run._cats;
  }
  const rate = (b) => b && b.total - b.error > 0 ? b.pass / (b.total - b.error) : null;
  const wilson = (p, n, z = 1.96) => { if (!n || p == null) return null; const d = 1 + z * z / n; return z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d; };

  // ---------- formatting ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // Displayed numbers follow the language (91,1% in Portuguese); SVG coordinates keep toFixed.
  const fx = (v, d) => v.toLocaleString(TAG(), { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = (v, d = 1) => v == null ? '—' : fx(v * 100, d) + '%';
  const secs = (v) => v == null ? '—' : v >= 1000 ? fx(v / 1000, 1) + ' s' : Math.round(v) + ' ms';
  const usd = (v) => v == null ? '—' : '$' + fx(v, v >= 0.1 ? 2 : v >= 0.01 ? 3 : 4);
  const int = (v) => v == null ? '—' : Math.round(v).toLocaleString(TAG());
  // "Oct 30, 2026" in English; "30 out 2026" / "30 oct 2026" elsewhere, without the "de" that pt-BR adds and that overflows the stat cells.
  const day = (iso) => {
    if (!iso) return '—';
    const d = new Date(iso.slice(0, 10) + 'T00:00:00Z');
    if (isNaN(d)) return iso;
    const opts = { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' };
    if (LANG === 'en') return d.toLocaleDateString(TAG(), opts);
    const p = Object.fromEntries(new Intl.DateTimeFormat(TAG(), opts).formatToParts(d).map(x => [x.type, x.value]));
    return `${p.day} ${p.month.replace(/\.$/, '')} ${p.year}`;
  };
  const seqClass = (p) => p == null ? 'na' : p >= .99 ? 'seq-700 dark' : p >= .9 ? 'seq-600 dark' : p >= .8 ? 'seq-500 dark' : p >= .7 ? 'seq-400 dark' : p >= .55 ? 'seq-300' : p >= .35 ? 'seq-200' : 'seq-100';
  const seqCell = (p, text, attrs = '') => { const cls = seqClass(p); return `<td class="seq ${cls}"${p == null ? '' : ` style="background:var(--${cls.split(' ')[0]})"`}${attrs}>${text}</td>`; };
  function score(run, cls = 'score', ci = true) {
    const v = run.scores.overall, h = ci ? wilson(v, run.total) : null;
    return `<span class="${cls}">${v == null ? '—' : fx(v * 100, 1)}<small>%</small>${h != null ? `<span class="ci" title="${esc(t('95% Wilson interval over {n} tests', { n: run.total }))}">±${fx(h * 100, 1)}</span>` : ''}</span>`;
  }
  function modelName(name, href) {
    const i = name.indexOf('/');
    const inner = i > 0 ? `<span class="prov">${esc(name.slice(0, i + 1))}</span>${esc(name.slice(i + 1))}` : esc(name);
    return href ? `<a class="model" href="${href}">${inner}</a>` : `<span class="model">${inner}</span>`;
  }
  const shortName = (m) => m.includes('/') ? m.split('/').pop() : m;
  /** Provenance chips; the ranking only flags exceptions, a model page also confirms the full suite. */
  function chips(r, s, { full = false } = {}) {
    const out = [];
    if (r.synthetic) out.push(`<span class="chip synthetic" title="${esc(t('Random scores generated to develop this page. Not a benchmark result.'))}">${esc(t('synthetic'))}</span>`);
    if (r.partial) out.push(`<span class="chip live" title="${esc(t('The harness is still writing this run: the score covers only the tests graded so far.'))}">${esc(t('in progress'))} ${r.total}/${s.full}</span>`);
    else if (r.subset && r.limit) out.push(`<span class="chip subset" title="${esc(t('Seeded subset: limit {limit}, seed {seed}', { limit: r.limit, seed: r.config.seed }))}">${esc(t('subset {n}/{full}', { n: r.total, full: s.full }))}</span>`);
    else if (r.subset) out.push(`<span class="chip" title="${esc(t('Ran {n} tests; the current full suite has {full} (a partial run or an earlier revision of the suite)', { n: r.total, full: s.full }))}">${esc(t('{n} tests', { n: r.total }))}</span>`);
    else if (full) out.push(`<span class="chip full" title="${esc(t('Every test in the suite was run'))}">${esc(t('full suite'))}</span>`);
    if (r.scoring_version !== s.scoring) out.push(`<span class="chip subset" title="${esc(t('Scores from another scoring version are not comparable'))}">${esc(t('scoring {v}', { v: r.scoring_version }))}</span>`);
    if (r.errored) out.push(`<span class="chip errored" title="${esc(t('Errored tests are left out of the scores'))}">${esc(t('{n} errored', { n: r.errored }))}</span>`);
    if (r.local) out.push(`<span class="chip local" title="${esc(t('Opened from this computer; not published'))}">${esc(t('local file'))}</span>`);
    return out.join('');
  }

  // ---------- routes ----------
  const enc = encodeURIComponent;
  const H = {
    board: (s) => `#/${enc(s)}`,
    model: (s, m, file) => `#/${enc(s)}/m/${enc(m)}${file ? `/r/${enc(file)}` : ''}`,
    test: (s, id) => `#/${enc(s)}/t/${enc(id)}`,
    cat: (s, c) => `#/${enc(s)}/c/${enc(c)}`,
    cats: (s) => `#/${enc(s)}/categories`,
    cost: (s) => `#/${enc(s)}/cost`,
    compare: (s, ms) => `#/${enc(s)}/compare/${ms.map(enc).join(',')}`,
    history: () => '#/history',
    how: () => '#/how',
  };
  const orderedSuites = () => [...S.suites.values()].sort((a, b) => latestOf(b.runs).length - latestOf(a.runs).length || a.name.localeCompare(b.name));
  const defaultSuite = () => orderedSuites()[0]?.name;
  // Links from the earlier tabbed page (#categories, #cost, ...) keep working.
  const LEGACY = { board: '', categories: 'categories', cost: 'cost', h2h: 'compare', hardest: '', history: 'history', how: 'how' };
  const GLOBAL_VIEWS = ['history', 'how'];
  function route() {
    const hash = location.hash.replace(/^#\/?/, '');
    if (hash in LEGACY && !S.suites.has(hash)) return GLOBAL_VIEWS.includes(LEGACY[hash]) ? { view: LEGACY[hash], suite: S.lastSuite || defaultSuite() } : { view: LEGACY[hash] || 'board', suite: S.lastSuite || defaultSuite(), models: S.compare };
    const raw = hash.split('/');
    const dec = (v) => { try { return decodeURIComponent(v || ''); } catch { return ''; } };
    if (GLOBAL_VIEWS.includes(raw[0])) return { view: raw[0], suite: S.lastSuite || defaultSuite() };
    const suite = S.suites.has(dec(raw[0])) ? dec(raw[0]) : defaultSuite();
    const kind = raw[1];
    if (kind === 'm') return { view: 'model', suite, model: dec(raw[2]), file: raw[3] === 'r' ? dec(raw[4]) : '' };
    if (kind === 't') return { view: 'test', suite, test: dec(raw[2]) };
    if (kind === 'c') return { view: 'category', suite, cat: dec(raw[2]) };
    if (kind === 'categories') return { view: 'categories', suite };
    if (kind === 'cost') return { view: 'cost', suite };
    if (kind === 'compare') return { view: 'compare', suite, models: (raw[2] || '').split(',').map(dec).filter(Boolean) };
    return { view: 'board', suite };
  }

  // ---------- strips ----------
  const TICK = 1.6, TICK_W = 1.1, GAP = 4, LANE_H = 22;
  function strip(run, s, h = LANE_H) {
    let out = '';
    for (let i = 0; i < s.size; i++) {
      const st = statusOf(run, s.order[i][0]);
      const x = s.xs[i].toFixed(1);
      if (st === 'pass') out += `<rect class="p" x="${x}" y="${h - 7}" width="${TICK_W}" height="7"/>`;
      else if (st === 'fail') out += `<rect class="f" x="${x}" y="0" width="${TICK_W}" height="${h}"/>`;
      else if (st === 'error') out += `<rect class="e" x="${x}" y="0" width="${TICK_W}" height="${h}"/>`;
      else out += `<rect class="n" x="${x}" y="${h - 1}" width="${TICK_W}" height="1"/>`;
    }
    const failed = run.total - run.passed - run.errored;
    return `<svg class="strip" data-run="${esc(run.key)}" data-suite="${esc(s.name)}" viewBox="0 0 ${s.width.toFixed(1)} ${h}" preserveAspectRatio="none" height="${h}" role="img" aria-label="${esc(run.model)}: ${esc(t('{p} passed, {f} failed', { p: run.passed, f: failed }) + (run.errored ? ', ' + t('{n} errored', { n: run.errored }) : '') + ' · ' + t('{n} tests', { n: s.size }))}">${out}</svg>`;
  }
  /** Failures by category for a table row: one bar per category, as tall as its failure rate. A tick per test is too thin at this width. */
  function miniBars(run, s, h = 16) {
    const w = 5, gap = 1.5, stats = catStats(run, s);
    const bars = s.cats.map((c, i) => {
      const b = stats.get(c.name), x = (i * (w + gap)).toFixed(1);
      if (!b || !b.total) return `<rect class="n" x="${x}" y="${h - 1}" width="${w}" height="1"><title>${esc(c.name)}: ${esc(t('not run'))}</title></rect>`;
      const bad = b.fail + b.error, bh = bad ? Math.max(4, Math.round(bad / b.total * h)) : 2;
      return `<rect class="${bad ? 'f' : 'p'}" x="${x}" y="${h - bh}" width="${w}" height="${bh}" rx="1"><title>${esc(c.name)}: ${esc(t('{bad} of {n} failed', { bad, n: b.total }))}</title></rect>`;
    }).join('');
    const failed = run.total - run.passed - run.errored;
    return `<svg class="minibars" viewBox="0 0 ${(s.cats.length * (w + gap) - gap).toFixed(1)} ${h}" preserveAspectRatio="none" height="${h}" role="img" aria-label="${esc(run.model)}: ${esc(t('{f} failed tests across {n} categories', { f: failed, n: s.cats.length }))}">${bars}</svg>`;
  }
  function ruler(s) {
    return `<svg class="ruler" data-suite="${esc(s.name)}" viewBox="0 0 ${s.width.toFixed(1)} 6" preserveAspectRatio="none" height="6" role="img" aria-label="${esc(t('{n} categories', { n: s.cats.length }))}">${s.cats.map(c => `<rect x="${c.x.toFixed(1)}" y="0" width="${c.w.toFixed(1)}" height="6" rx="1"/>`).join('')}</svg>`;
  }
  const xAt = (s, svg, clientX) => { const box = svg.getBoundingClientRect(); return (clientX - box.left) / box.width * s.width; };
  const testIndexAt = (s, svg, clientX) => {
    const x = xAt(s, svg, clientX);
    let lo = 0, hi = s.size - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (s.xs[mid] <= x) lo = mid; else hi = mid - 1; }
    return (lo + 1 < s.size && Math.abs(s.xs[lo + 1] - x) < Math.abs(x - s.xs[lo])) ? lo + 1 : lo;
  };
  const catAt = (s, svg, clientX) => { const x = xAt(s, svg, clientX); return s.cats.find(c => x >= c.x - GAP / 2 && x <= c.x + c.w + GAP / 2) || null; };
  function setBand(container, s, c) {
    if (!container) return;
    if (!c) { container.style.setProperty('--band-d', 'none'); return; }
    container.style.setProperty('--band-d', 'block');
    container.style.setProperty('--band-l', `${(c.x - 1) / s.width * 100}%`);
    container.style.setProperty('--band-w', `${(c.w + 2) / s.width * 100}%`);
  }

  // ---------- views ----------
  function render() {
    if (!S.loaded) return;
    const r = route();
    if (r.suite) S.lastSuite = r.suite;
    const inSuite = (m) => S.suites.get(r.suite)?.runs.some(x => x.model === m);
    S.compare = (r.view === 'compare' ? r.models : S.compare).filter(inSuite).slice(0, 3);
    renderChrome(r);
    renderLocalBar();
    if (S.srcInfo) $('srcLine').textContent = t('{runs} runs · {tests} tests · data built {built} UTC', S.srcInfo) + S.srcInfo.from;
    hideTip();
    const s = S.suites.get(r.suite);
    if (!s && !GLOBAL_VIEWS.includes(r.view)) { main.innerHTML = `<div class="status">${esc(t('No runs found in the results folder yet.'))}</div>`; return; }
    ({ board: viewBoard, model: viewModel, test: viewTest, category: viewCategory, categories: viewCategories, cost: viewCost, compare: viewCompare, history: viewHistory, how: viewHow })[r.view](r, s);
    renderTray(r);
  }

  function renderChrome(r) {
    $('suites').innerHTML = orderedSuites().map(s => `<a href="${H.board(s.name)}" aria-current="${s.name === r.suite && !GLOBAL_VIEWS.includes(r.view)}">${esc(s.name)}<small class="num">${s.full}</small></a>`).join('');
    const views = [
      ['board', t('Ranking'), H.board(r.suite)],
      ['compare', `${t('Compare')}${S.compare.length ? `<span class="pill num">${S.compare.length}</span>` : ''}`, H.compare(r.suite, S.compare)],
      ['categories', t('Categories'), H.cats(r.suite)],
      ['cost', t('Score vs cost'), H.cost(r.suite)],
      ['history', t('History'), H.history()],
      ['how', t('How it works'), H.how()],
    ];
    const current = r.view === 'model' || r.view === 'test' ? 'board' : r.view === 'category' ? 'categories' : r.view;
    $('views').innerHTML = views.map(([k, label, href]) => `<a href="${href}"${k === current ? ' aria-current="page"' : ''}>${label}</a>`).join('');
  }

  function syntheticNotice(s) {
    const synthetic = s.runs.filter(x => x.synthetic).length;
    if (!synthetic) return '';
    const real = latestOf(s.runs.filter(x => !x.synthetic)).length;
    return `<p class="notice synthetic">${esc(t('{n} of {total} runs in {suite} are synthetic: random scores generated to build this page, tagged below. Models with real runs: {real}.', { n: synthetic, total: s.runs.length, suite: s.name, real }))}${S.showSynthetic ? '' : ' ' + esc(t('They are hidden now.'))}</p>`;
  }

  /** Home (the list from the build_data page): a stat strip and one table of each model's latest run, ranked full runs first; tick rows to compare. */
  const BOARD_COLS = [
    ['rank', '#', (r, rank) => rank.get(r) ?? Infinity],
    ['model', 'Model', r => r.model, 'left'],
    ['overall', 'Overall', r => r.scores.overall],
    ['strip', 'Failures by category', null, 'left'],

  }
  /** Test bodies render on first open; the container keeps one listener that reads the latest list. */
  function bindTestBodies(container, at, s, { across = true } = {}) {
    container._bodies = { at, s, across };
    if (container._bound) return;
    container._bound = true;
    container.addEventListener('toggle', e => {
      const d = e.target;
      if (!d.matches?.('details.test') || !d.open || d.dataset.filled) return;
      d.dataset.filled = '1';
      const { at: get, s: suite, across: link } = container._bodies;
      const [run, id] = get(+d.dataset.i);
      d.querySelector('.test-body').innerHTML = testBody(run, id, suite, link);
    }, true);
  }
  // WordPress notices (_doing_it_wrong and friends) carry HTML; show their text.
  const plain = (text) => String(text ?? '').replace(/<[^>]+>/g, '').replace(/&quot;/g, '"').replace(/&#0?39;/g, "'");

  function testBody(run, id, s, across = true) {
    const st = statusOf(run, id), f = run.failures[id], meta = S.data.tests[id] || {};
    const links = [
      across && `<a href="${H.test(s.name, id)}">${esc(t('How every model did on this test'))}</a>`,
      meta.category && `<a href="${esc(definitionUrl(s.name, meta.category))}" rel="noopener" target="_blank">${esc(t('Test definition'))}</a>`,
      !run.local && `<a href="${esc(fileUrl(run))}" rel="noopener" target="_blank">${esc(t('Full run output'))}</a>`,
    ].filter(Boolean).join('');
    if (st === 'none') return `<div class="links">${links}</div><p class="muted">${esc(t('This run did not include the test.'))}</p>`;
    const refs = (meta.source_refs || []).length ? `<h4>${esc(t('Core source'))}</h4><div class="refs">${meta.source_refs.map(x => `<code>${esc(x.replace(/^src\//, ''))}</code>`).join('')}</div>` : '';
    if (st === 'pass') return `<div class="links">${links}</div><p class="muted" style="margin:8px 0 0">${esc(t('Passed every runtime assertion with no forbidden pattern.'))}</p>${refs}`;
    return `
      <div class="links">${links}</div>
      <div class="kv"><span>${esc(t('why'))} <b>${esc(t(f.reason))}</b></span>${f.runtime_score != null ? `<span>runtime <b>${pct(f.runtime_score)}</b></span>` : ''}</div>
      ${f.error ? `<p class="notice fail" style="margin:10px 0 0">${esc(plain(f.error))}</p>` : ''}
      ${f.assertions?.length ? `<h4>${esc(t('Failed assertions'))}</h4><ul class="checks">${f.assertions.map(a => `<li><span class="mark" aria-label="${esc(t('failed'))}">✗</span><div>${esc(plain(a))}</div></li>`).join('')}</ul>` : ''}
      ${f.stderr ? `<h4>stderr</h4><pre><code>${esc(plain(f.stderr))}</code></pre>` : ''}
      ${refs}`;
  }

  function viewTest(r, s) {
    const cat = s.tests.get(r.test);
    if (!cat) { main.innerHTML = `${crumbs(s, [[esc(r.test)]])}<div class="status">${t('No test called {id} in {suite}.', { id: `<code>${esc(r.test)}</code>`, suite: esc(s.name) })}</div>`; return; }
    const rows = boardRuns(s);
    const ran = rows.filter(x => statusOf(x, r.test) !== 'none');
    const passed = ran.filter(x => statusOf(x, r.test) === 'pass');
    const order = { fail: 0, error: 1, pass: 2, none: 3 };
    const listed = [...rows].sort((a, b) => order[statusOf(a, r.test)] - order[statusOf(b, r.test)] || a.rank - b.rank);
    const idx = s.index.get(r.test);
    const prev = s.order[idx - 1], next = s.order[idx + 1];
    main.innerHTML = `
      ${crumbs(s, [[esc(cat), H.cat(s.name, cat)], [esc(r.test)]])}
      <div class="hero">
        <div>
          <h1>${esc(r.test)}</h1>
          <div class="chips"><a class="chip" href="${H.cat(s.name, cat)}">${esc(cat)}</a><a class="chip" href="${esc(definitionUrl(s.name, cat))}" rel="noopener" target="_blank">${esc(t('Test definition'))} ↗</a></div>
        </div>
        <div class="big-score"><div class="v">${passed.length}<small> / ${ran.length}</small></div><div class="l">${esc(t('models in the ranking pass this test'))}</div></div>
      </div>
      <div class="toolbar">${prev ? `<a class="btn" href="${H.test(s.name, prev[0])}">← ${esc(prev[0])}</a>` : ''}${next ? `<a class="btn" href="${H.test(s.name, next[0])}">${esc(next[0])} →</a>` : ''}</div>
      <div class="sheet" id="testList">${listed.map((x, i) => testRow(x, r.test, s, { i, showCat: false, label: `${modelName(x.model)} ${x.synthetic ? `<span class="chip synthetic">${esc(t('synthetic'))}</span>` : ''}${x.failures[r.test]?.assertions?.[0] ? `<span class="why">${esc(plain(x.failures[r.test].assertions[0]))}</span>` : ''}` })).join('') || `<div class="empty">${esc(t('No model in the ranking ran this test.'))}</div>`}</div>`;
    bindTestBodies($('testList'), (i) => [listed[i], r.test], s, { across: false });
  }

  /** Categories (from the build_data page): pass rate per category per model, one sequential ramp. */
  function viewCategories(r, s) {
    const rows = boardRuns(s);
    if (!rows.length) { main.innerHTML = `<div class="sheet empty">${esc(t('No models in {suite} match the filters.', { suite: s.name }))}</div>`; return; }
    const stat = (x, c) => catStats(x, s).get(c);
    const avg = (c) => rows.reduce((acc, x) => acc + (rate(stat(x, c)) ?? 0), 0) / rows.length;
    const cats = s.cats.map(c => c.name).sort((a, b) => avg(b) - avg(a) || a.localeCompare(b));
    const cell = (x, c) => {
      const b = c ? stat(x, c) : { pass: x.passed, total: x.total, error: x.errored };
      const v = rate(b), cls = seqClass(v);
      if (!b || !b.total) return '<td><span class="cell seq na">—</span></td>';
      return `<td><span class="cell seq ${cls}" style="background:var(--${cls.split(' ')[0]})" role="button" tabindex="0" data-model="${esc(x.model)}" data-cat="${esc(c ?? '')}" data-p="${b.pass}" data-n="${b.total - b.error}">${Math.round(v * 100)}</span></td>`;
    };
    main.innerHTML = `
      ${syntheticNotice(s)}
      <div class="toolbar"><span>${t('Pass rate per category for the latest run of each model in {suite}; darker is higher. Click a cell to list its tests. Categories with fewer than 5 tests are marked {chip}: one test moves them by 20 points or more.', { suite: esc(s.name), chip: '<span class="chip">n&lt;5</span>' })}</span><span class="grow"></span>${filterToggles()}</div>
      <div class="cat-layout">
      <div class="sheet pad grid-wrap">
        <table class="heat"><thead><tr><th class="cat"></th>${rows.map(x => `<th class="col${x.synthetic ? ' synthetic' : ''}" title="${esc(x.model)}${x.synthetic ? ' · ' + esc(t('synthetic')) : ''}"><a href="${H.model(s.name, x.model)}">${esc(x.model)}</a></th>`).join('')}</tr></thead>
        <tbody>
          <tr class="total"><th class="cat">${esc(t('overall'))}<span class="n">n=${s.full}</span></th>${rows.map(x => cell(x, null)).join('')}</tr>
          ${cats.map(c => { const n = s.cats.find(x => x.name === c).count; return `<tr><th class="cat"><a href="${H.cat(s.name, c)}">${esc(c)}</a><span class="n">n=${n}</span>${n < 5 ? ' <span class="chip">n&lt;5</span>' : ''}</th>${rows.map(x => cell(x, c)).join('')}</tr>`; }).join('')}
        </tbody></table>
        <div class="legend">0%<span class="ramp">${[100, 200, 300, 400, 500, 600, 700].map(n => `<i style="background:var(--seq-${n})"></i>`).join('')}</span>100%</div>
      </div>
      <div class="sheet" id="cellDetail" hidden></div>
      </div>`;
    bindFilterToggles();
    const heat = main.querySelector('table.heat');
    const open = (el) => {
      heat.querySelectorAll('.cell[aria-pressed]').forEach(x => x.removeAttribute('aria-pressed'));
      el.setAttribute('aria-pressed', 'true');
      showCell(s, rows.find(x => x.model === el.dataset.model), el.dataset.cat || null);
    };
    heat.addEventListener('click', e => { const el = e.target.closest('.cell[data-model]'); if (el) open(el); });
    heat.addEventListener('keydown', e => { const el = e.target.closest('.cell[data-model]'); if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open(el); } });
    heat.addEventListener('mousemove', e => { const el = e.target.closest('.cell[data-model]'); if (!el) return hideTip(); showTip(`<b>${esc(el.dataset.model)}</b><br>${esc(t('{cat}: {p}/{n} passed', { cat: el.dataset.cat || t('overall'), p: el.dataset.p, n: el.dataset.n }))}`, e.clientX, e.target.getBoundingClientRect().top); });
    heat.addEventListener('mouseleave', hideTip);
  }
  function showCell(s, run, cat) {
    if (!run) return;
    const ids = s.order.filter(([id, c]) => (!cat || c === cat) && statusOf(run, id) !== 'none').map(([id]) => id);
    const ok = ids.filter(id => statusOf(run, id) === 'pass').length;
    const el = $('cellDetail');
    el.hidden = false;
    el.innerHTML = `<div class="section-head cell-head"><h2>${modelName(run.model, H.model(s.name, run.model))} · ${cat ? `<a href="${H.cat(s.name, cat)}" class="mono">${esc(cat)}</a>` : esc(t('all categories'))}</h2><p>${esc(t('{ok}/{n} passed', { ok, n: ids.length }))}</p></div>
      <div id="cellTests">${ids.map((id, i) => testRow(run, id, s, { i, showCat: !cat })).join('')}</div>`;
    bindTestBodies($('cellTests'), (i) => [run, ids[i]], s);
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /** Score vs cost (from the build_data page): overall against the run's estimated cost, log scale. */
  function viewCost(r, s) {
    const rows = boardRuns(s);
    main.innerHTML = `
      ${syntheticNotice(s)}
      <div class="toolbar"><span>${esc(t('Overall score against the estimated cost of the full run (log scale). Up and to the left is better. Hover a point for details, click it to open the model.'))}</span><span class="grow"></span>${filterToggles()}</div>
      <div class="sheet pad"><svg id="scatter" class="chart" role="img" aria-label="${esc(t('Overall score versus estimated cost per run'))}"></svg>
        ${rows.some(x => x.synthetic) ? `<div class="legend"><span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="var(--blueberry)"/></svg> ${esc(t('real run'))}</span><span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="var(--sheet)" stroke="var(--notice)" stroke-width="1.5" stroke-dasharray="2 1.5"/></svg> ${esc(t('synthetic'))}</span></div>` : ''}
      </div>
      <div class="sheet grid-wrap" style="margin-top:12px"><table class="grid">
        <thead><tr><th class="left">${esc(t('model'))}</th><th class="right">${esc(t('overall'))}</th><th class="right">${esc(t('cost / run'))}</th><th class="right">$ / pass</th><th class="right">${esc(t('passes per $'))}</th><th class="right">${esc(t('tokens / test'))}</th><th class="right">${esc(t('latency p50'))}</th></tr></thead>
        <tbody>${rows.map(x => `<tr><td class="left">${modelName(x.model, H.model(s.name, x.model))} ${chips(x, s)}</td><td class="right"><strong>${pct(x.scores.overall)}</strong></td><td class="right">${usd(x.cost.total)}</td><td class="right">${usd(x.cost.per_pass)}</td><td class="right">${x.cost.total ? fx(x.passed / x.cost.total, 1) : '—'}</td><td class="right">${int(x.tokens.completion_p50)}</td><td class="right">${secs(x.latency.p50)}</td></tr>`).join('')}</tbody>
      </table></div>`;
    bindFilterToggles();
    drawScatter(s, rows);
  }
  function drawScatter(s, rows) {
    const svg = $('scatter'); if (!svg) return;
    const pts = rows.filter(x => x.cost.total != null && x.scores.overall != null);
    const W = svg.clientWidth || 800, Hh = svg.clientHeight || 380, m = { t: 16, r: 28, b: 44, l: 52 };
    svg.setAttribute('viewBox', `0 0 ${W} ${Hh}`);
    if (!pts.length) { svg.innerHTML = `<text x="${W / 2}" y="${Hh / 2}" text-anchor="middle">${esc(t('No runs with cost estimates in this suite.'))}</text>`; return; }
    const costs = pts.map(p => p.cost.total);
    const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...costs)))), hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...costs))));
    const x = (c) => m.l + (Math.log10(c) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo) || 1) * (W - m.l - m.r);
    const y = (v) => m.t + (1 - v) * (Hh - m.t - m.b);
    const xt = []; for (let v = lo; v <= hi * 1.0001; v *= 10) xt.push(v);
    const yt = [0, .2, .4, .6, .8, 1];
    svg.innerHTML = `
      ${yt.map(v => `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`).join('')}
      <line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"/><line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${y(0)}"/>
      ${yt.map(v => `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`).join('')}
      ${xt.map(v => `<text x="${x(v)}" y="${Hh - m.b + 18}" text-anchor="middle">$${v >= 1 ? v : fx(v, -Math.floor(Math.log10(v)))}</text>`).join('')}
      <text x="${(m.l + W - m.r) / 2}" y="${Hh - 6}" text-anchor="middle">${esc(t('estimated cost of the full run (log)'))}</text>
      ${pts.map((p, i) => `<circle class="dot${p.synthetic ? ' synthetic' : ''}" r="6" cx="${x(p.cost.total)}" cy="${y(p.scores.overall)}" data-i="${i}" tabindex="0" role="link" aria-label="${esc(p.model)}: ${pct(p.scores.overall)}, ${usd(p.cost.total)}"/>`).join('')}
      ${pts.map(p => `<text class="lbl${p.synthetic ? ' synthetic' : ''}" x="${x(p.cost.total) + 10}" y="${y(p.scores.overall) + 4}">${esc(shortName(p.model))}</text>`).join('')}`;
    svg.querySelectorAll('.dot').forEach(d => {
      const p = pts[+d.dataset.i];
      d.addEventListener('mousemove', e => showTip(`<b>${esc(p.model)}</b>${p.synthetic ? ' · ' + esc(t('synthetic')) : ''}<br>${esc(t('overall {a} · {b} per run', { a: pct(p.scores.overall), b: usd(p.cost.total) }))}<br>${esc(t('{a} per passed test · p50 {b}', { a: usd(p.cost.per_pass), b: secs(p.latency.p50) }))}`, e.clientX, d.getBoundingClientRect().top));
      d.addEventListener('mouseleave', hideTip);
      const go = () => { location.hash = H.model(s.name, p.model); };
      d.addEventListener('click', go);
      d.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    });
  }
  addEventListener('resize', () => { const r = S.loaded && route(); if (r && r.view === 'cost') drawScatter(S.suites.get(r.suite), boardRuns(S.suites.get(r.suite))); });

  function viewCategory(r, s) {
    const c = s.cats.find(x => x.name === r.cat);
    if (!c) { main.innerHTML = `${crumbs(s, [[esc(r.cat)]])}<div class="status">${t('No category called {cat} in {suite}.', { cat: `<code>${esc(r.cat)}</code>`, suite: esc(s.name) })}</div>`; return; }
    const rows = boardRuns(s);
    const ids = s.order.slice(c.start, c.start + c.count).map(([id]) => id);
    const mark = (st) => st === 'pass' ? `<span class="ok" aria-label="${esc(t('passed'))}">✓</span>` : st === 'fail' ? `<span class="ko" aria-label="${esc(t('failed'))}">✗</span>` : st === 'error' ? `<span class="er" aria-label="${esc(t('errored'))}">!</span>` : `<span class="na" aria-label="${esc(t('not run'))}">·</span>`;
    main.innerHTML = `
      ${crumbs(s, [[esc(t('categories')), H.cats(s.name)], [esc(c.name)]])}
      <div class="hero"><div><h1>${esc(c.name)}</h1><div class="chips"><span class="chip">${esc(t('{n} tests', { n: c.count }))}</span><a class="chip" href="${esc(definitionUrl(s.name, c.name))}" rel="noopener" target="_blank">${esc(t('Test definitions'))} ↗</a></div></div></div>
      <div class="sheet grid-wrap"><table class="grid">
        <thead><tr><th class="rowh">${esc(t('test'))}</th><th>${esc(t('passed by'))}</th>${rows.map(x => `<th title="${esc(x.model)}"><a href="${H.model(s.name, x.model)}">${esc(shortName(x.model))}</a>${x.synthetic ? `<br><span class="chip synthetic">${esc(t('synthetic'))}</span>` : ''}</th>`).join('')}</tr></thead>
        <tbody>${ids.map(id => {
          const sts = rows.map(x => statusOf(x, id));
          const ran = sts.filter(v => v !== 'none').length, ok = sts.filter(v => v === 'pass').length;
          return `<tr><th class="rowh"><a href="${H.test(s.name, id)}">${esc(id)}</a></th>${seqCell(ran ? ok / ran : null, `${ok}/${ran}`)}${sts.map(st => `<td class="mark"><a href="${H.test(s.name, id)}" title="${STATUS[st]}">${mark(st)}</a></td>`).join('')}</tr>`;
        }).join('')}</tbody>
      </table></div>`;
  }

  function viewCompare(r, s) {
    const runs = S.compare.map(m => primaryRun(s, m)).filter(Boolean);
    if (runs.length < 2) {
      main.innerHTML = `<div class="section-head" style="margin-top:0"><h2>${esc(t('Compare models'))}</h2></div><div class="sheet empty">${t('Tick two or three models in the {link} to line their tests up here.', { link: `<a href="${H.board(s.name)}">${esc(t('ranking'))}</a>` })}${runs.length ? ` ${t('Picked so far: {list}.', { list: runs.map(x => `<code>${esc(x.model)}</code>`).join(', ') })}` : ''}</div>`;
      return;
    }
    const [a] = runs;
    const only = runs.map(() => []), allFailed = [], mixed = [];
    for (const [id] of s.order) {
      const st = runs.map(x => statusOf(x, id));
      if (st.every(v => v === 'none')) continue;
      const pass = st.map(v => v === 'pass');
      const n = pass.filter(Boolean).length;
      if (n === runs.length) continue;
      if (n === 0) { if (st.some(v => v === 'fail' || v === 'error')) allFailed.push(id); continue; }
      if (n === 1) only[pass.indexOf(true)].push(id); else mixed.push(id);
    }
    const catRows = s.cats.map(c => ({ c, rates: runs.map(x => rate(catStats(x, s).get(c.name))) }))
      .map(row => ({ ...row, spread: Math.max(...row.rates.map(v => v ?? 0)) - Math.min(...row.rates.map(v => v ?? 0)) }))
      .sort((x, y) => y.spread - x.spread || x.c.name.localeCompare(y.c.name));
    const ids = (list) => list.length ? `<div class="idlist">${list.map(id => `<a href="${H.test(s.name, id)}">${esc(id)}</a>`).join('')}</div>` : `<p class="muted" style="margin:6px 0 0">${esc(t('None.'))}</p>`;
    const delta = (x) => { const d = (x.scores.overall - a.scores.overall) * 100; return `<span class="${d >= 0 ? 'delta-up' : 'delta-down'}" style="font-size:13px;font-weight:500">${d >= 0 ? '+' : ''}${fx(d, 1)}</span>`; };
    main.innerHTML = `
      ${crumbs(s, [[esc(t('compare'))]])}
      <div class="cmp-heads">${runs.map((x, i) => `<div class="sheet">${modelName(x.model, H.model(s.name, x.model))}<div>${chips(x, s)}</div><div class="score" style="text-align:left">${fx(x.scores.overall * 100, 1)}<small>%</small> ${i ? delta(x) : ''}</div><div class="muted num" style="font-size:12.5px">${esc(t('{a}/{b} passed', { a: x.passed, b: x.total }))} · ${usd(x.cost.total)}${i && a.cost.total && x.cost.total ? ` (${fx(x.cost.total / a.cost.total, 1)}×)` : ''} · ${secs(x.latency.p50)}</div></div>`).join('')}</div>
      <div class="sheet cmp-lanes" id="board">
        <div class="ruler-wrap"><div class="ruler-label" id="rulerLabel" style="margin-left:0"><span>${esc(t('Strips line up test by test · hover to find a category or test'))}</span></div><div class="lane">${ruler(s)}</div></div>
        <ol class="ledger">${runs.map(x => `<li class="entry"><div class="line" style="grid-template-columns:minmax(0,1fr) auto"><span class="who">${modelName(x.model)}</span><span class="facts num">${x.passed}/${x.total}</span></div><div class="lane${x.synthetic ? ' synthetic' : ''}">${strip(x, s)}</div></li>`).join('')}</ol>
      </div>
      <div class="section-head"><h2>${esc(t('Where they differ'))}</h2><p>${esc(t('{n} tests split the models · {m} fail everywhere', { n: only.reduce((n, l) => n + l.length, 0) + mixed.length, m: allFailed.length }))}</p></div>
      <div class="diff-groups">
        ${runs.map((x, i) => `<div class="sheet"><h3>${t('Only {model} passed', { model: modelName(x.model) })} <span class="c num">${only[i].length}</span></h3>${ids(only[i])}</div>`).join('')}
        ${runs.length > 2 ? `<div class="sheet"><h3>${esc(t('Split'))} <span class="c num">${mixed.length}</span></h3>${ids(mixed)}</div>` : ''}
        <div class="sheet"><h3>${esc(t('Every model failed'))} <span class="c num">${allFailed.length}</span></h3>${ids(allFailed)}</div>
      </div>
      <div class="section-head"><h2>${esc(t('Categories'))}</h2><p>${esc(t('largest gaps first'))}</p></div>
      <div class="sheet grid-wrap"><table class="grid">
        <thead><tr><th class="rowh">${esc(t('category'))}</th>${runs.map(x => `<th>${esc(shortName(x.model))}</th>`).join('')}<th>${esc(t('gap'))}</th></tr></thead>
        <tbody>${catRows.map(({ c, rates, spread }) => `<tr><th class="rowh"><a href="${H.cat(s.name, c.name)}">${esc(c.name)}</a></th>${rates.map(v => seqCell(v, pct(v, 0))).join('')}<td class="num muted">${spread ? fx(spread * 100, 0) + ' ' + t('pts') : '—'}</td></tr>`).join('')}</tbody>
      </table></div>`;
  }

  /** History (from the build_data page): every commit that touched the results folder, with score snapshots. */
  function viewHistory() {
    const Hs = S.data.history || [];
    main.innerHTML = `
      <div class="section-head" style="margin-top:0"><h2>${esc(t('History'))}</h2><p>${t('every commit that touched {dir} · pick one to see which runs it added, removed or changed and how the latest score per model moved', { dir: `<code>${RESULTS}</code>` })}</p></div>
      ${Hs.length ? `<div class="hist"><div class="sheet commits" id="commits">${Hs.map((c, i) => `
        <div class="commit" data-i="${i}" tabindex="0">

  function showCommit(i) {

  // ---------- jump-to search ----------
  const q = $('q'), list = $('qResults');
  let options = [], active = -1;
  function searchIndex(term) {
    const needle = term.trim().toLowerCase();
    if (!needle) return [];
    const rank = (text) => { const v = text.toLowerCase(); const i = v.indexOf(needle); return i < 0 ? -1 : i === 0 ? 0 : 1; };
    const take = (items, n) => items.map(x => ({ ...x, rank: rank(x.key) })).filter(x => x.rank >= 0).sort((a, b) => a.rank - b.rank || a.key.localeCompare(b.key, undefined, { numeric: true })).slice(0, n);
    const models = [], cats = [], tests = [];
    for (const s of S.suites.values()) {
      for (const m of new Set(s.runs.map(x => x.model))) { const run = primaryRun(s, m); models.push({ group: 'Models', key: m, desc: `${s.name} · ${pct(run.scores.overall)}${run.synthetic ? ' · ' + t('synthetic') : ''}`, href: H.model(s.name, m) }); }
      for (const c of s.cats) cats.push({ group: 'Categories', key: c.name, desc: `${s.name} · ${t('{n} tests', { n: c.count })}`, href: H.cat(s.name, c.name) });
      for (const [id, cat] of s.order) tests.push({ group: 'Tests', key: id, desc: `${s.name} · ${cat}`, href: H.test(s.name, id) });
    }
    return [...take(models, 6), ...take(cats, 5), ...take(tests, 8)];
  }
  function showResults() {
    options = searchIndex(q.value);
    active = options.length ? 0 : -1;
    if (!q.value.trim()) { closeResults(); return; }
    let group = '';
    list.innerHTML = options.length ? options.map((o, i) => `${o.group !== group ? `<li class="group" role="presentation">${esc(t(group = o.group))}</li>` : ''}<li role="option" id="opt${i}" data-i="${i}" aria-selected="${i === active}"><span class="k">${esc(o.key)}</span><span class="d">${esc(o.desc)}</span></li>`).join('') : `<li class="none" role="presentation">${esc(t('Nothing matches "{q}".', { q: q.value.trim() }))}</li>`;
    list.hidden = false;
    q.setAttribute('aria-expanded', 'true');
    q.setAttribute('aria-activedescendant', active >= 0 ? 'opt' + active : '');

  function closeResults() { list.hidden = true; q.setAttribute('aria-expanded', 'false'); q.removeAttribute('aria-activedescendant'); }
  function move(d) {
    if (!options.length) return;
    active = (active + d + options.length) % options.length;

    q.setAttribute('aria-activedescendant', 'opt' + active);
